<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>さんすう ― モコの おべんきょうハウス</title>
<link rel="manifest" href="../manifest.json">
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="icon" href="../icon-192.png">
<meta name="theme-color" content="#ffd9e3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="おべんきょうハウス">
<meta name="sw" content="../sw.js">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common/style.css">
<style>
nav{grid-template-columns:repeat(3,1fr)}
nav a{text-decoration:none;padding:8px 0 10px;font-weight:800;font-size:12px;color:#b89a9a;display:flex;flex-direction:column;align-items:center;gap:2px}
nav a span{font-size:24px}
a.big{text-align:center;text-decoration:none}
.clockq{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:30px}
.clockq svg{width:150px;height:150px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="pts">⭐ <span id="pts">0</span></div>
    <div class="ttl">✏️ さんすう</div>
    <a id="tohub" href="../index.html" aria-label="おうちに もどる">🏠</a>
  </header>
  <main id="view"></main>
  <nav>
    <button data-act="go" data-arg="select"><span>✏️</span>もんだい</button>
    <button data-act="go" data-arg="tests"><span>🏆</span>テスト</button>
    <a href="../index.html"><span>🏠</span>おうち</a>
  </nav>
</div>
<div id="ov" class="hide"></div>
<script src="../common/learning-history.js"></script>
<script src="../common/core.js"></script>
<script>
/* ---------- がめん ---------- */
let view=location.hash==='#tests'?'tests':'select',quiz=null;
function go(v){if(view==='test')stopTest();view=v;render();$('main').scrollTop=0}
function render(){
 updPts();
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.arg===view||(view==='quiz'||view==='result')&&b.dataset.arg==='select'||view==='test'&&b.dataset.arg==='tests'));
 const V={select,quizV,result,tests,test:testV}[view==='quiz'?'quizV':view];
 $('#view').innerHTML=V();
}
const enabled=()=>TYPES.filter(t=>S.settings.types[t.id].on);
function select(){
 const en=enabled();
 if(!en.length) return `<div class="card"><p class="muted">もんだいが えらばれていません。<br>おうちのひとに おうちの ⚙️ せってい で えらんでもらってね</p></div>`;
 return `<h2>どの もんだいに する？</h2><div class="tgrid">
 ${en.map(t=>`<button class="tbtn" data-act="start" data-arg="${t.id}"><b>${t.name}</b>れい：${t.ex}<small>せいかいで ⭐${S.settings.types[t.id].pts}</small></button>`).join('')}
 ${en.length>1?`<button class="tbtn mix" data-act="start" data-arg="mix"><b>🎲 まぜまぜ</b>いろんな もんだいが でるよ</button>`:''}
 </div><p class="muted">${S.settings.perRound}もん ぜんぶ せいかいで ボーナス ⭐${S.settings.perfect}！</p>`}
// 学習履歴（保護者レポート用）。せいかい・ほし の しょりは そのまま、けっかが きまったら きろく だけ する
const lhRec=(c,tid,inp,ok,n,mode,stars,lv)=>{LH.recordAttempt({questionInstanceId:c.iid,questionKey:`sansu:${tid}:${c.p.join('')}`,subject:'sansu',topic:tid,skill:tid,difficulty:lv||0,mode,questionText:probText(c.p),correctAnswer:String(c.ans),userAnswer:String(inp),isCorrect:ok,attemptNumber:n,earnedStars:stars,params:{p:c.p}})};
function startQuiz(sel){
 const pool=sel==='mix'?enabled().map(t=>t.id):[sel];
 quiz={pool,sel,i:0,n:S.settings.perRound,ok:0,earned:0,res:[],cur:null,input:'',tries:0,mood:'normal',msg:'',lock:false,last:''};LH.startSession({subject:'sansu',mode:'practice'});
 nextQ();view='quiz';render();$('main').scrollTop=0}
function nextQ(){
 let p,tid,g=0;
 do{tid=quiz.pool[r(0,quiz.pool.length-1)];p=TYPE[tid].gen()}while(p.join()===quiz.last&&g++<10);
 quiz.last=p.join();quiz.cur={tid,p,ans:ansOf(p),iid:LH.newInstance()};quiz.input='';quiz.tries=0;quiz.mood='normal';quiz.msg='';LH.begin(quiz.cur.iid)}
function quizV(){
 const q=quiz,[a,op,b]=q.cur.p;
 const dots=Array.from({length:q.n},(_,i)=>`<i class="${q.res[i]===true?'ok':q.res[i]===false?'ng':i===q.i?'now':''}"></i>`).join('');
 const keys=[1,2,3,4,5,6,7,8,9].map(n=>`<button class="key" data-act="key" data-arg="${n}">${n}</button>`).join('');
 return `<div class="dots">${dots}</div>
 <div class="card qcard">${charSVG(S.equip,q.mood,q.mood==='happy'?'hop':'')}<div class="prob">${probHTML(q.cur.p,q.input)}</div></div>
 <div class="msg">${q.msg||'⭐'+S.settings.types[q.cur.tid].pts+' の もんだい'}</div>
 <div class="pad">${keys}<button class="key del" data-act="del">けす</button><button class="key" data-act="key" data-arg="0">0</button><button class="key ok" data-act="answer">こたえる</button></div>`}
function answer(){
 const q=quiz;if(q.lock||q.input==='')return;
 const tp=S.settings.types[q.cur.tid].pts,right=Number(q.input)===q.cur.ans;
 lhRec(q.cur,q.cur.tid,q.input,right,q.tries+1,'practice',right?(q.tries===0?tp:Math.ceil(tp/2)):0,0);
 if(right){
  const pts=q.tries===0?tp:Math.ceil(tp/2);
  q.ok++;q.earned+=pts;q.res[q.i]=true;S.points+=pts;S.stats.q++;S.stats.ok++;save();
  q.mood='happy';q.msg=`せいかい！ ⭐＋${pts}`;sOk();q.lock=true;render();
  setTimeout(advance,1100);
 }else if(q.tries===0){
  q.tries=1;q.input='';q.mood='oops';q.msg='おしい！ もういちど やってみよう';sNg();render();
 }else{
  q.res[q.i]=false;S.stats.q++;save();q.mood='oops';q.msg=`こたえは ${q.cur.ans} だよ。つぎ がんばろう！`;q.input=String(q.cur.ans);sNg();q.lock=true;render();
  setTimeout(advance,1800);
 }}
function advance(){
 const q=quiz;q.lock=false;q.i++;
 if(q.i>=q.n){
  q.bonus=(q.ok===q.n&&S.settings.perfect>0)?S.settings.perfect:0;
  if(q.bonus){S.points+=q.bonus;save()}
  LH.endSession();view='result';if(q.bonus)sBuy();render();return}
 nextQ();render()}
function result(){
 const q=quiz,perfect=q.ok===q.n;
 return `<div class="card" style="text-align:center"><div style="width:150px;margin:0 auto">${charSVG(S.equip,'happy','hop')}</div>
 <h2 style="font-size:24px">${perfect?'ぜんもん せいかい！すごい！':q.ok>=q.n/2?'よく がんばったね！':'チャレンジ えらい！'}</h2>
 <div>${q.n}もん ちゅう <b style="font-size:24px;color:#e0719a">${q.ok}</b>もん せいかい</div>
 <div class="stars" style="margin:10px 0">⭐＋${q.earned}${q.bonus?` <small style="font-size:16px">（ボーナス＋${q.bonus}）</small>`:''}</div></div>
 <button class="big" data-act="start" data-arg="${q.sel}">もういちど</button><div style="height:10px"></div>
 <a class="big sub" href="../index.html#shop">おみせに いく 🛍️</a>`}
/* ---------- テスト ---------- */
let test=null,tTimer=null;
function tests(){
 const en=enabled();
 if(!en.length) return `<div class="card"><p class="muted">もんだいが えらばれていません</p></div>`;
 return `<h2>🏆 テスト</h2><p class="muted" style="text-align:left">じかん ないに ごうかく すると、ここでしか もらえない とくべつな アイテムが もらえるよ！</p>`+
 en.map(t=>`<div class="card"><b>${t.name}</b>${TLV.map((L,lv)=>{const key=t.id+'-'+(lv+1),st=S.tests[key]||{},it=testItem(key),open=testUnlocked(key);
  return `<div class="trow ${st.pass?'pass':''}"><div class="tth">${thumb(it)}</div><div class="lbl"><b>${L.medal} ${L.name}　<span style="color:#e0719a">${it.name}</span></b><small>${L.n}もん ／ ⏱${testLimit(t.id,lv)}びょう ／ ${passRule(L)}で ごうかく</small><small>${st.pass?'✔ ごうかく ずみ！':open?(st.best!=null?'さいこう：'+st.best+'もん':'ちょうせん できるよ！'):'🔒 まえの テストに ごうかく すると ひらくよ'}</small>
   <div class="tbtns"><button class="prac" data-act="tready" data-arg="${key}|p">✏️ れんしゅう <span>⭐×${S.settings.practiceMul}</span></button><button class="${open?'':'off'}" data-act="${open?'tready':'tlock'}" data-arg="${key}">🏆 テスト</button></div></div></div>`}).join('')}</div>`).join('')}
const pracPts=tid=>S.settings.types[tid].pts*S.settings.practiceMul;
function testReady(arg){
 const [key,p]=arg.split('|'),prac=p==='p',{tid,lv}=parseKey(key),L=TLV[lv],it=testItem(key);
 showPop(`<div class="medal">${prac?'✏️':L.medal}</div><h3>${TYPE[tid].name}<br>${L.name}${prac?' の れんしゅう':''}</h3>
 <div style="text-align:left;line-height:1.8;margin:8px 0">・もんだい：${L.n}もん<br>・じかん：<b>${testLimit(tid,lv)}びょう</b><br>・まちがえても やりなおしは できないよ<br>${prac?`・せいかい 1もんで <b>⭐${pracPts(tid)}</b>（ふだんの ${S.settings.practiceMul}ばい！）<br>・${passRule(L)}で ボーナス ⭐${S.settings.practiceBonus}`:`・${passRule(L)}で ごうかく`}</div>
 ${prac?'':`<div style="width:90px;margin:0 auto">${thumb(it)}</div><div>ごほうび：<b>${it.name}</b></div>`}
 <div class="btns"><button class="big gray" data-act="close">やめる</button><button class="big ${prac?'sub':''}" data-act="tstart" data-arg="${arg}">スタート！</button></div>`)}
function stopTest(){clearInterval(tTimer);tTimer=null}
function startTest(arg){
 closePop();stopTest();
 const [key,p]=arg.split('|'),{tid,lv}=parseKey(key),L=TLV[lv];
 LH.startSession({subject:'sansu',mode:p==='p'?'testprac':'test'});
 test={key,tid,lv,prac:p==='p',earned:0,n:L.n,need:L.need,limit:testLimit(tid,lv)*1000,i:0,ok:0,input:'',cur:null,last:'',lock:false,phase:'count',count:3,msg:'',t0:0};
 view='test';tNext();render();$('main').scrollTop=0;beep(660,.1);
 tTimer=setInterval(()=>{
  if(!test){stopTest();return}
  if(test.phase==='count'){test.count--;if(test.count<=0){test.phase='run';test.t0=performance.now();stopTest();beep(990,.2);render();tTimer=setInterval(tTick,100)}else{beep(660,.1);render()}}
 },800)}
function tNext(){let p,g=0;do{p=TYPE[test.tid].gen()}while(p.join()===test.last&&g++<10);test.last=p.join();test.cur={p,ans:ansOf(p),iid:LH.newInstance()};test.input='';LH.begin(test.cur.iid)}
function tLeft(){return Math.max(0,test.limit-(performance.now()-test.t0))}
function tTick(){
 if(!test||test.phase!=='run')return;
 const left=tLeft(),pct=left/test.limit*100,bar=$('#tbar'),sec=$('#tsec');
 if(bar){bar.style.width=pct+'%';bar.classList.toggle('low',pct<25)}
 if(sec)sec.textContent=Math.ceil(left/1000);
 if(left<=0)finishTest(true)}
function testV(){
 const t=test;
 if(t.phase==='count') return `<div class="card" style="text-align:center"><div class="medal">${t.prac?'✏️':TLV[t.lv].medal}</div><b>${TYPE[t.tid].name} ${TLV[t.lv].name}${t.prac?' の れんしゅう':''}</b><div class="count">${t.count}</div><div class="muted">よーい…</div></div>`;
 const [a,op,b]=t.cur.p,left=tLeft(),pct=left/t.limit*100;
 const keys=[1,2,3,4,5,6,7,8,9].map(n=>`<button class="key" data-act="key" data-arg="${n}">${n}</button>`).join('');
 return `<div class="tbarw"><div class="tbar ${pct<25?'low':''}" id="tbar" style="width:${pct}%"></div></div>
 <div class="tinfo"><span>⏱ <b id="tsec">${Math.ceil(left/1000)}</b>びょう</span><span>${t.prac?'✏️ ':''}${t.i+1} / ${t.n}もんめ</span><span>⭕ ${t.ok}</span></div>
 <div class="card qcard"><div class="prob" style="font-size:44px">${probHTML(t.cur.p,t.input)}</div></div>
 <div class="msg">${t.msg||'&nbsp;'}</div>
 <div class="pad">${keys}<button class="key del" data-act="del">けす</button><button class="key" data-act="key" data-arg="0">0</button><button class="key ok" data-act="answer">こたえる</button></div>`}
function testAnswer(){
 const t=test;if(t.phase!=='run'||t.lock||t.input==='')return;
 S.stats.q++;
 {const ok=Number(t.input)===t.cur.ans;lhRec(t.cur,t.tid,t.input,ok,1,t.prac?'testprac':'test',ok&&t.prac?pracPts(t.tid):0,t.lv+1)}
 if(Number(t.input)===t.cur.ans){t.ok++;S.stats.ok++;
  if(t.prac){const pts=pracPts(t.tid);t.earned+=pts;S.points+=pts;t.msg=`⭕ せいかい！ ⭐＋${pts}`}else t.msg='⭕ せいかい！';
  beep(1046,.08)}
 else{t.msg=`❌ こたえは ${t.cur.ans}`;sNg()}
 save();t.i++;
 if(t.i>=t.n||(!t.prac&&(t.i-t.ok)>(t.n-t.need))){t.lock=true;stopTest();render();setTimeout(()=>finishTest(false),500);return}
 const wrong=t.msg.startsWith('❌');
 if(wrong){t.lock=true;t.input=String(t.cur.ans);t.i--;render();t.i++;setTimeout(()=>{if(!test||view!=='test')return;t.lock=false;tNext();render()},700)}
 else{tNext();render()}}
function finishTest(timeout){
 const t=test;if(!t||t.phase==='done')return;
 t.phase='done';stopTest();LH.endSession();
 if(t.prac){
  const okLine=t.ok>=t.need,bonus=okLine?S.settings.practiceBonus:0;
  if(bonus){S.points+=bonus}save();view='tests';render();
  okLine?sBuy():sNg();
  showPop(`${charSVG(S.equip,okLine?'happy':'oops',okLine?'hop':'')}<h3>${timeout?'じかん ぎれ！':'れんしゅう おわり！'}</h3><div>${timeout?`${t.n}もん ちゅう ${t.i}もん まで こたえて ${t.ok}もん せいかい`:`${t.n}もん ちゅう ${t.ok}もん せいかい`}</div>
  <div class="stars" style="margin:8px 0">⭐＋${t.earned+bonus}${bonus?` <small style="font-size:15px">（ボーナス＋${bonus}）</small>`:''}</div>
  <div class="muted">${okLine?'テストなら ごうかく できる ちょうし！🏆':`テストの ごうかくまで あと ${t.need-t.ok}もん！`}</div>
  <div class="btns"><button class="big sub" data-act="tstart" data-arg="${t.key}|p">もういちど</button>${testUnlocked(t.key)?`<button class="big" data-act="tready" data-arg="${t.key}">テストへ 🏆</button>`:''}</div>
  <div class="btns"><button class="big gray" data-act="close">とじる</button></div>${hwDone()?hwBack():''}`);
  test=null;return}
 const L=TLV[t.lv],it=testItem(t.key),pass=t.ok>=t.need,st=S.tests[t.key]||{},first=pass&&!st.pass;
 dailyOf(S).sansu++; // きょうの もくひょう
 S.tests[t.key]={pass:!!(st.pass||pass),best:Math.max(st.best||0,t.ok)};
 if(first)grantItem(it.id)
 save();view='tests';render();
 if(pass){sBuy();
  showPop(`<div class="medal">${L.medal}</div><h3>ごうかく！</h3><div>${t.n}もん ちゅう ${t.ok}もん せいかい</div>
  ${first?`<div style="width:110px;margin:8px auto">${it.cat==='furn'||it.cat==='wall'||it.cat==='floor'?thumb(it):charSVG({...S.equip,[it.cat]:it.id},'happy','hop')}</div><div><b>${it.name}</b> を ゲット！</div>
  <div class="btns"><button class="big gray" data-act="close">あとで</button><button class="big" data-act="twear" data-arg="${it.id}">${it.cat==='furn'||it.cat==='wall'||it.cat==='floor'?'おへやを みる':'つけてみる'}</button></div>`
  :`<div class="btns"><button class="big" data-act="close">OK</button></div>`}`)}
 else{sNg();
  showPop(`${charSVG(S.equip,'oops')}<h3>${timeout?'じかん ぎれ！':'ざんねん！'}</h3><div>${timeout?`${t.n}もん ちゅう ${t.i}もん まで こたえて `:''}${t.ok}もん せいかい（ごうかくは ${t.need}もん）</div><div class="muted">れんしゅう して また ちょうせん しよう！</div>
  <div class="btns"><button class="big gray" data-act="close">とじる</button><button class="big" data-act="tstart" data-arg="${t.key}">もういちど</button></div>`)}
 test=null}

/* ---------- ボタンの うごき ---------- */
Object.assign(ACT,{
 go:a=>{sTap();go(a)},
 start:a=>{sTap();startQuiz(a)},
 key:a=>{const q=view==='test'?test:quiz;if(!q||q.lock||(view==='test'&&q.phase!=='run'))return;if(q.input.length<3){q.input=(q.input==='0'?'':q.input)+a;sTap();render()}},
 del:()=>{const q=view==='test'?test:quiz;if(!q||q.lock)return;q.input=q.input.slice(0,-1);sTap();render()},
 answer:()=>view==='test'?testAnswer():answer(),
 tready:a=>{sTap();testReady(a)},
 tlock:()=>{sNg();showPop(`<h3>🔒</h3><div>まえの テストに ごうかく すると ちょうせん できるよ！</div><div class="btns"><button class="big" data-act="close">OK</button></div>`)},
 tstart:a=>startTest(a),
 twear:a=>{closePop();const it=ITEM[a];if(it.cat!=='furn')equipItem(a);save();location.href=it.cat==='furn'?'../index.html':['outfit','hat','acc'].includes(it.cat)?'../index.html#dress':'../index.html#dress-room'},
 close:a=>{closePop();if(a)go(a)},
});
render();
// 学習レポートの「練習へ」：#start=しゅるい で その れんしゅうを はじめる
{const m=/^#start=(\w+)/.exec(location.hash);if(m&&enabled().some(t=>t.id===m[1]))ready.then(()=>startQuiz(m[1]))}
// まちの じゅうにんの しゅくだい：その テストの れんしゅうを ひらく
if(HW)ready.then(()=>{if(!(TYPE)[parseKey(HW.key).tid])return;view='tests';render();testReady(HW.key+'|p')});
</script>
</body>
</html>
