<!DOCTYPE html>
<html lang="ja">
<head>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#fff3ec}
body{font-family:"M PLUS Rounded 1c",system-ui,sans-serif;color:#5a4646;-webkit-user-select:none;user-select:none}
#app{max-width:520px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;background:#fff8f3}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:#ffd9e3;box-shadow:0 2px 0 #f6b9ca}
.pts{background:#fff;border-radius:999px;padding:6px 14px;font-weight:800;font-size:20px;color:#e0719a;min-width:96px;box-shadow:0 2px 0 #f3b3c6}
.ttl{font-weight:800;font-size:15px;color:#c8577f}
#gear{border:0;background:#fff;border-radius:50%;width:40px;height:40px;font-size:20px;box-shadow:0 2px 0 #f3b3c6}
main{flex:1;overflow-y:auto;padding:12px}
nav{display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:3px solid #ffd9e3;padding-bottom:env(safe-area-inset-bottom)}
nav button{border:0;background:none;padding:8px 0 10px;font:inherit;font-weight:800;font-size:12px;color:#b89a9a;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:24px}
nav button.on{color:#e0719a}
.card{background:#fff;border-radius:22px;box-shadow:0 3px 0 #f1d3d3;padding:12px;margin-bottom:12px}
.room svg{width:100%;display:block;border-radius:16px}
.room{position:relative}
.bubble{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#fff;border-radius:16px;padding:6px 14px;font-weight:800;font-size:14px;box-shadow:0 2px 0 #e9cfcf;white-space:nowrap;color:#c8577f}
.big{display:block;width:100%;border:0;border-radius:20px;padding:16px;font:inherit;font-weight:800;font-size:22px;color:#fff;background:#ff8fb1;box-shadow:0 4px 0 #e0688f}
.big:active,.tbtn:active,.key:active{transform:translateY(3px);box-shadow:none}
.big.sub{background:#8fc8ff;box-shadow:0 4px 0 #5fa3e6}
.big.gray{background:#c9bcbc;box-shadow:0 4px 0 #a99a9a}
.muted{color:#a88f8f;font-size:13px;text-align:center;margin:8px 0}
h2{font-size:18px;margin:4px 0 10px;color:#c8577f}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tbtn{border:0;border-radius:18px;padding:14px 8px;font:inherit;background:#fff;box-shadow:0 4px 0 #f1cfd8;color:#5a4646}
.tbtn b{display:block;font-size:18px}
.tbtn small{display:block;color:#e0719a;font-weight:800;margin-top:4px}
.tbtn.mix{grid-column:1/-1;background:#fff0c2;box-shadow:0 4px 0 #f0d27a}
.dots{display:flex;gap:6px;justify-content:center;margin-bottom:8px}
.dots i{width:14px;height:14px;border-radius:50%;background:#f0dede}
.dots i.ok{background:#ff8fb1}.dots i.ng{background:#c9bcbc}.dots i.now{outline:3px solid #ffb6ca}
.qcard{display:flex;align-items:center;gap:6px}
.qcard svg{width:84px;flex:none}
.prob{flex:1;text-align:center;font-weight:800;font-size:40px;letter-spacing:1px}
.ans{display:inline-block;min-width:1.8em;border-bottom:4px solid #ffb6ca;color:#e0719a}
.msg{text-align:center;font-weight:800;min-height:24px;color:#e0719a;margin:4px 0}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.key{border:0;border-radius:18px;font:inherit;font-weight:800;font-size:30px;padding:12px 0;background:#fff;box-shadow:0 4px 0 #ecd2d2;color:#5a4646}
.key.del{background:#ffe9d6;font-size:18px}.key.ok{background:#ff8fb1;color:#fff;font-size:20px;box-shadow:0 4px 0 #e0688f}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.tabs button{flex:none;border:0;border-radius:999px;padding:8px 14px;font:inherit;font-weight:800;background:#fff;color:#a88f8f;box-shadow:0 2px 0 #ecd2d2}
.tabs button.on{background:#ff8fb1;color:#fff;box-shadow:0 2px 0 #e0688f}
.items{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.item{border:0;background:#fff;border-radius:16px;padding:6px;font:inherit;box-shadow:0 3px 0 #ecd2d2;color:#5a4646}
.item svg{width:100%;height:84px;display:block;background:#fff7f2;border-radius:12px}
.item .n{font-size:11px;font-weight:800;margin-top:4px;min-height:28px;line-height:1.25}
.item .p{font-size:14px;font-weight:800;color:#e0719a}
.item.own .p{color:#7bbf8f}
.item.sp{background:linear-gradient(160deg,#fff8d6,#ffe6f0);box-shadow:0 3px 0 #f0cf7a}
.item.sp .p{color:#d18a00}
.item.sel{outline:4px solid #ff8fb1}
.preview svg{width:100%;max-height:260px;display:block}
.row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px dashed #f0dada}
.row:last-child{border:0}
.row .lbl{flex:1}.row .lbl b{display:block}.row .lbl small{color:#a88f8f}
.step{display:flex;align-items:center;gap:6px}
.step button{width:36px;height:36px;border-radius:50%;border:0;background:#ffe3ea;font:inherit;font-weight:800;font-size:20px;color:#c8577f}
.step span{min-width:32px;text-align:center;font-weight:800;font-size:18px}
.sw{width:52px;height:30px;border-radius:999px;background:#e5d6d6;border:0;position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:#ff8fb1}.sw.on::after{left:25px}
#ov{position:fixed;inset:0;background:rgba(90,60,60,.35);display:flex;align-items:center;justify-content:center;z-index:9;padding:20px}
#ov.hide{display:none}
.pop{background:#fff;border-radius:26px;padding:20px;max-width:340px;width:100%;text-align:center;animation:pop .25s}
.pop svg{width:120px}
.pop h3{margin:6px 0;font-size:24px;color:#e0719a}
.pop .btns{display:flex;gap:10px;margin-top:14px}.pop .btns .big{font-size:18px;padding:12px}
.pop input{font:inherit;font-size:28px;width:120px;text-align:center;border:3px solid #ffd0dc;border-radius:14px;padding:6px}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.hop{animation:hop .6s ease}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-18px)}70%{transform:translateY(0)}85%{transform:translateY(-6px)}}
.hop,.sway{transform-box:fill-box;transform-origin:center bottom}
.sway{animation:sway 3s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.stars{font-size:28px;letter-spacing:4px}
.trow{display:flex;gap:10px;align-items:center;width:100%;border:0;background:#fff7f2;border-radius:16px;padding:8px;margin-top:8px;font:inherit;color:#5a4646;text-align:left}
.trow.pass{background:#eaf8ee}.trow .lbl{flex:1}
.tbtns{display:flex;gap:6px;margin-top:6px}
.tbtns button{flex:1;border:0;border-radius:12px;padding:8px 4px;font:inherit;font-weight:800;font-size:13px;background:#ff8fb1;color:#fff;box-shadow:0 3px 0 #e0688f}
.tbtns button.prac{background:#8fd3a8;box-shadow:0 3px 0 #5fb37f}
.tbtns button.prac span{font-size:11px}
.tbtns button.off{background:#d9cccc;box-shadow:0 3px 0 #b9aaaa}
.tbtns button:active{transform:translateY(2px);box-shadow:none}
.trow .tth{width:64px;flex:none}.trow .tth svg{width:64px;height:64px;display:block;background:#fff;border-radius:12px}
.trow small{display:block;color:#a88f8f;font-size:11px;margin-top:2px}
.tbarw{height:18px;background:#f0e2e2;border-radius:999px;overflow:hidden}
.tbar{height:100%;background:#7fd19a;transition:width .1s linear}
.tbar.low{background:#ff8a8a}
.tinfo{display:flex;justify-content:space-between;font-weight:800;margin:6px 2px 8px}
.count{font-size:80px;font-weight:800;color:#e0719a;text-align:center;flex:1}
.seg{display:flex;gap:4px}.seg button{border:0;border-radius:999px;padding:6px 10px;font:inherit;font-weight:800;font-size:12px;background:#ffe3ea;color:#c8577f}.seg button.on{background:#ff8fb1;color:#fff}
.item.lock .p{color:#c9a04a;font-size:11px}
.medal{font-size:56px;line-height:1}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="pts">⭐ <span id="pts">0</span></div>
    <div class="ttl">モコのさんすうハウス</div>
    <button id="gear" data-act="gate" aria-label="せってい">⚙️</button>
  </header>
  <main id="view"></main>

    <button data-act="go" data-arg="home"><span>🏠</span>おへや</button>

  </nav>
</div>
<div id="ov" class="hide"></div>
<script>
/* ---------- データ定義 ---------- */
const r=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const TYPES=[

 {id:'add22',name:'2けた ＋ 2けた', ex:'34 ＋ 28',pts:3, gen:()=>[r(10,99),'+',r(10,99)]},
 {id:'sub1', name:'1けた − 1けた', ex:'8 − 3',  pts:1, gen:()=>{const a=r(2,9);return [a,'-',r(1,a)]}},

 {id:'sub22',name:'2けた − 2けた', ex:'52 − 18',pts:3, gen:()=>{const a=r(11,99);return [a,'-',r(10,a)]}},

const TYPE=Object.fromEntries(TYPES.map(t=>[t.id,t]));
const ITEMS=[
 {id:'o_none',cat:'outfit',name:'なし',price:0},
 {id:'o_pink',cat:'outfit',name:'ピンクのワンピース',price:20},
 {id:'o_over',cat:'outfit',name:'あおいオーバーオール',price:25},

 {id:'h_ribbon',cat:'hat',name:'リボン',price:10},

 {id:'h_crown',cat:'hat',name:'おうかん',price:60},
 {id:'a_none',cat:'acc',name:'なし',price:0},
 {id:'a_balloon',cat:'acc',name:'ふうせん',price:15},
 {id:'a_bag',cat:'acc',name:'ポシェット',price:20},
 {id:'a_wand',cat:'acc',name:'ほしのステッキ',price:40},
 {id:'w_cream',cat:'wall',name:'クリームのかべ',price:0},
 {id:'w_dots',cat:'wall',name:'みずたまのかべ',price:30},
 {id:'w_stripe',cat:'wall',name:'そらいろストライプ',price:30},
 {id:'w_night',cat:'wall',name:'ほしぞらのかべ',price:50},
 {id:'f_wood',cat:'floor',name:'きのゆか',price:0},
 {id:'f_mint',cat:'floor',name:'ミントのじゅうたん',price:25},
 {id:'f_tile',cat:'floor',name:'ピンクのタイル',price:25},
 {id:'u_rug',cat:'furn',name:'ふわふわラグ',price:20,box:'80 222 205 58'},
 {id:'u_plant',cat:'furn',name:'うえきばち',price:15,box:'300 172 62 104'},
 {id:'u_poster',cat:'furn',name:'ほしのポスター',price:15,box:'140 20 78 88'},
 {id:'u_lamp',cat:'furn',name:'ランプ',price:20,box:'250 128 84 142'},
 {id:'u_bear',cat:'furn',name:'くまのぬいぐるみ',price:30,box:'34 234 52 64'},
 {id:'u_shelf',cat:'furn',name:'ほんだな',price:35,box:'228 2 112 108'},
 {id:'u_bed',cat:'furn',name:'ベッド',price:40,box:'0 164 130 100'},
 /* ✨ スペシャル（こうがく） */
 {id:'c_moko',cat:'char',name:'うさぎの モコ',price:0},
 {id:'c_hamster',cat:'char',name:'ハムスターの ポテ',price:400,special:true},
 {id:'c_penguin',cat:'char',name:'ペンギンの ペペ',price:500,special:true},
 {id:'c_cat',cat:'char',name:'スコティッシュフォールドの ミルク',price:800,special:true},
 {id:'o_kimono',cat:'outfit',name:'ふりそで',price:180,special:true},
 {id:'o_magical',cat:'outfit',name:'まほうしょうじょの ドレス',price:250,special:true},

 {id:'h_unicorn',cat:'hat',name:'ユニコーンの つの',price:200,special:true},
 {id:'a_wings',cat:'acc',name:'てんしの はね',price:220,special:true},
 {id:'a_fairy',cat:'acc',name:'ようせいの はね',price:280,special:true},
 {id:'w_candy',cat:'wall',name:'おかしの かべ',price:150,special:true},
 {id:'w_space',cat:'wall',name:'うちゅうの かべ',price:200,special:true},
 {id:'f_flower',cat:'floor',name:'おはなばたけの ゆか',price:160,special:true},
 {id:'u_chandelier',cat:'furn',name:'シャンデリア',price:250,special:true,box:'138 0 84 78'},
 {id:'u_canopy',cat:'furn',name:'てんがいつき ベッド',price:350,special:true,box:'0 108 134 156'},
 /* テスト ごうかくで もらえる アイテム */
 {id:'a_icecream',cat:'acc',name:'アイスクリーム',test:'add1-1'},
 {id:'h_tiara',cat:'hat',name:'ティアラ',test:'add1-2'},
 {id:'u_trophy',cat:'furn',name:'きんのトロフィー',test:'add1-3',box:'230 252 50 50'},
 {id:'a_bouquet',cat:'acc',name:'はなたば',test:'add21-1'},
 {id:'o_sailor',cat:'outfit',name:'セーラーふく',test:'add21-2'},
 {id:'w_rainbow',cat:'wall',name:'にじのかべ',test:'add21-3'},
 {id:'u_fish',cat:'furn',name:'きんぎょばち',test:'add22-1',box:'278 256 46 46'},
 {id:'h_witch',cat:'hat',name:'まじょのぼうし',test:'add22-2'},
 {id:'o_stardress',cat:'outfit',name:'ほしぞらドレス',test:'add22-3'},
 {id:'a_umbrella',cat:'acc',name:'かさ',test:'sub1-1'},
 {id:'h_chef',cat:'hat',name:'コックぼうし',test:'sub1-2'},
 {id:'f_cloud',cat:'floor',name:'くものゆか',test:'sub1-3'},
 {id:'u_piano',cat:'furn',name:'おもちゃのピアノ',test:'sub21-1',box:'82 262 64 40'},
 {id:'o_apron',cat:'outfit',name:'エプロン',test:'sub21-2'},
 {id:'u_garland',cat:'furn',name:'ガーランド',test:'sub21-3',box:'122 0 116 40'},
 {id:'a_heart',cat:'acc',name:'ハートのステッキ',test:'sub22-1'},
 {id:'h_halo',cat:'hat',name:'てんしのわっか',test:'sub22-2'},
 {id:'o_rainbow',cat:'outfit',name:'にじいろドレス',test:'sub22-3'},
];
const ITEM=Object.fromEntries(ITEMS.map(i=>[i.id,i]));
const CATS=[['special','✨スペシャル'],['char','🐾キャラ'],['outfit','ふく'],['hat','ぼうし'],['acc','こもの'],['wall','かべ'],['floor','ゆか'],['furn','かぐ']];

/* ---------- 状態と保存 ---------- */
function defState(){return{v:1,t:0,points:0,
 owned:['c_moko','o_none','h_none','a_none','w_cream','f_wood'],
 equip:{char:'c_moko',outfit:'o_none',hat:'h_none',acc:'a_none',wall:'w_cream',floor:'f_wood'},
 furn:[],
 settings:{types:Object.fromEntries(TYPES.map(t=>[t.id,{on:t.id.startsWith('add'),pts:t.pts}])),perRound:5,perfect:3,daily:5,sound:true,testScale:1,practiceMul:2,practiceBonus:5},
 lastDay:'',stats:{q:0,ok:0},tests:{}}}
function merge(d){
 const s=defState(); if(!d||typeof d!=='object') return s;
 if(typeof d.points==='number') s.points=d.points;
 s.t=d.t||0; s.lastDay=d.lastDay||'';
 if(Array.isArray(d.owned)) s.owned=[...new Set([...s.owned,...d.owned.filter(i=>ITEM[i])])];
 if(d.equip) for(const k in s.equip) if(d.equip[k]&&ITEM[d.equip[k]]) s.equip[k]=d.equip[k];
 if(Array.isArray(d.furn)) s.furn=d.furn.filter(i=>ITEM[i]);
 const ds=d.settings||{};
 for(const k of ['perRound','perfect','daily','practiceMul','practiceBonus']) if(typeof ds[k]==='number') s.settings[k]=ds[k];
 if(typeof ds.sound==='boolean') s.settings.sound=ds.sound;
 if(ds.types) for(const id in s.settings.types) if(ds.types[id]) Object.assign(s.settings.types[id],ds.types[id]);
 if(d.stats) Object.assign(s.stats,d.stats);
 if(typeof ds.testScale==='number') s.settings.testScale=ds.testScale;
 if(d.tests&&typeof d.tests==='object') s.tests=d.tests;
 return s}
const LS='moko-math-v1';
let S=merge((()=>{try{return JSON.parse(localStorage.getItem(LS)||'null')}catch(e){return null}})());
let dbRef=null,dbTimer=null;
function save(){S.t=Date.now();try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
 if(dbRef){clearTimeout(dbTimer);dbTimer=setTimeout(()=>{try{Promise.resolve(dbRef.set(JSON.parse(JSON.stringify(S)))).catch(()=>{})}catch(e){}},800)}
 updPts()}
async function initDb(){
 try{
  if(!window.claude||typeof window.claude.use!=='function') return;
  const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
  if(!db||!user) return;
  const id=await user.id(); if(!id) return;
  const ref=db.collection('data/users/'+id).doc('save');
  const res=await ref.get();
  let d=null;
  if(res){ if(typeof res.data==='function') d=res.data(); else if(res.data&&typeof res.data==='object') d=res.data; else d=res; }
  dbRef=ref;
  if(d&&typeof d.points==='number'&&(d.t||0)>(S.t||0)){S=merge(d);try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){};render()}
  else save();
 }catch(e){}
}
const today=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
function dailyCheck(){
 if(S.lastDay===today()) return;
 S.lastDay=today(); const b=S.settings.daily; if(b>0) S.points+=b; save();
 if(b>0) showPop(`${charSVG(S.equip,'happy')}<h3>おかえり！</h3><div>きょうの ログインボーナス</div><div class="stars">⭐＋${b}</div><div class="btns"><button class="big" data-act="close">やったー！</button></div>`,true);
}

/* ---------- 音 ---------- */
let AC;
function beep(f,d=.12,v=.12){if(!S.settings.sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
const sTap=()=>beep(520,.06,.06);
const sOk=()=>{beep(660);setTimeout(()=>beep(880),110);setTimeout(()=>beep(1320,.25),220)};
const sNg=()=>{beep(330,.15);setTimeout(()=>beep(260,.2),150)};
const sBuy=()=>[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.15),i*90));

/* ---------- キャラクター（モコ） ---------- */
const star=(cx,cy,R,rr)=>{let p=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,q=i%2?rr:R;p.push((cx+q*Math.cos(a)).toFixed(1)+','+(cy+q*Math.sin(a)).toFixed(1))}return p.join(' ')};
const BODY='#fff6ef',LINE='#e7b5a3',INK='#4b3a3a';
const OUTFIT={
 o_none:'',

function startQuiz(sel){
 const pool=sel==='mix'?enabled().map(t=>t.id):[sel];
 quiz={pool,sel,i:0,n:S.settings.perRound,ok:0,earned:0,res:[],cur:null,input:'',tries:0,mood:'normal',msg:'',lock:false,last:''};
 nextQ();view='quiz';render();$('main').scrollTop=0}
function nextQ(){
 let p,tid,g=0;
 do{tid=quiz.pool[r(0,quiz.pool.length-1)];p=TYPE[tid].gen()}while(p.join()===quiz.last&&g++<10);
 quiz.last=p.join();quiz.cur={tid,p,ans:p[1]==='+'?p[0]+p[2]:p[0]-p[2]};quiz.input='';quiz.tries=0;quiz.mood='normal';quiz.msg=''}

 const keys=[1,2,3,4,5,6,7,8,9].map(n=>`<button class="key" data-act="key" data-arg="${n}">${n}</button>`).join('');
 return `<div class="dots">${dots}</div>
 <div class="card qcard">${charSVG(S.equip,q.mood,q.mood==='happy'?'hop':'')}<div class="prob">${a} ${op==='+'?'＋':'−'} ${b} = <span class="ans">${q.input||'&nbsp;'}</span></div></div>
 <div class="msg">${q.msg||'⭐'+S.settings.types[q.cur.tid].pts+' の もんだい'}</div>
 <div class="pad">${keys}<button class="key del" data-act="del">けす</button><button class="key" data-act="key" data-arg="0">0</button><button class="key ok" data-act="answer">こたえる</button></div>`}
function answer(){
 const q=quiz;if(q.lock||q.input==='')return;
 const tp=S.settings.types[q.cur.tid].pts;
 if(Number(q.input)===q.cur.ans){
  const pts=q.tries===0?tp:Math.ceil(tp/2);
  q.ok++;q.earned+=pts;q.res[q.i]=true;S.points+=pts;S.stats.q++;S.stats.ok++;save();
  q.mood='happy';q.msg=`せいかい！ ⭐＋${pts}`;sOk();q.lock=true;render();
  setTimeout(advance,1100);
 }else if(q.tries===0){
  q.tries=1;q.input='';q.mood='oops';q.msg='おしい！ もういちど やってみよう';sNg();render();
 }else{
  q.res[q.i]=false;S.stats.q++;save();q.mood='oops';q.msg=`こたえは ${q.cur.ans} だよ。つぎ がんばろう！`;q.input=String(q.cur.ans);sNg();q.lock=true;render();
  setTimeout(advance,1800);
 }}
function advance(){
 const q=quiz;q.lock=false;q.i++;
 if(q.i>=q.n){
  q.bonus=(q.ok===q.n&&S.settings.perfect>0)?S.settings.perfect:0;
  if(q.bonus){S.points+=q.bonus;save()}
  view='result';if(q.bonus)sBuy();render();return}
 nextQ();render()}

function stopTest(){clearInterval(tTimer);tTimer=null}
function startTest(arg){
 closePop();stopTest();
 const [key,p]=arg.split('|'),{tid,lv}=parseKey(key),L=TLV[lv];
 test={key,tid,lv,prac:p==='p',earned:0,n:L.n,need:L.need,limit:testLimit(tid,lv)*1000,i:0,ok:0,input:'',cur:null,last:'',lock:false,phase:'count',count:3,msg:'',t0:0};
 view='test';tNext();render();$('main').scrollTop=0;beep(660,.1);
 tTimer=setInterval(()=>{
  if(!test){stopTest();return}
  if(test.phase==='count'){test.count--;if(test.count<=0){test.phase='run';test.t0=performance.now();stopTest();beep(990,.2);render();tTimer=setInterval(tTick,100)}else{beep(660,.1);render()}}
 },800)}

 return `<div class="tbarw"><div class="tbar ${pct<25?'low':''}" id="tbar" style="width:${pct}%"></div></div>
 <div class="tinfo"><span>⏱ <b id="tsec">${Math.ceil(left/1000)}</b>びょう</span><span>${t.prac?'✏️ ':''}${t.i+1} / ${t.n}もんめ</span><span>⭕ ${t.ok}</span></div>
 <div class="card qcard"><div class="prob" style="font-size:44px">${a} ${op==='+'?'＋':'−'} ${b} = <span class="ans">${t.input||'&nbsp;'}</span></div></div>

function testAnswer(){

 if(Number(t.input)===t.cur.ans){t.ok++;S.stats.ok++;
  if(t.prac){const pts=pracPts(t.tid);t.earned+=pts;S.points+=pts;t.msg=`⭕ せいかい！ ⭐＋${pts}`}else t.msg='⭕ せいかい！';
  beep(1046,.08)}
 else{t.msg=`❌ こたえは ${t.cur.ans}`;sNg()}
 save();t.i++;
 if(t.i>=t.n||(!t.prac&&(t.i-t.ok)>(t.n-t.need))){t.lock=true;stopTest();render();setTimeout(()=>finishTest(false),500);return}
 const wrong=t.msg.startsWith('❌');
 if(wrong){t.lock=true;t.input=String(t.cur.ans);t.i--;render();t.i++;setTimeout(()=>{if(!test||view!=='test')return;t.lock=false;tNext();render()},700)}
 else{tNext();render()}}

  <div class="stars" style="margin:8px 0">⭐＋${t.earned+bonus}${bonus?` <small style="font-size:15px">（ボーナス＋${bonus}）</small>`:''}</div>
  <div class="muted">${okLine?'テストなら ごうかく できる ちょうし！🏆':`テストの ごうかくまで あと ${t.need-t.ok}もん！`}</div>

  <div class="btns"><button class="big gray" data-act="close">とじる</button></div>`);
  test=null;return}
 const L=TLV[t.lv],it=testItem(t.key),pass=t.ok>=t.need,st=S.tests[t.key]||{},first=pass&&!st.pass;
 S.tests[t.key]={pass:!!(st.pass||pass),best:Math.max(st.best||0,t.ok)};
 if(first&&!S.owned.includes(it.id)){S.owned.push(it.id);if(it.cat==='furn'&&!S.furn.includes(it.id))S.furn.push(it.id)}
 save();view='tests';render();

  showPop(`<div class="medal">${L.medal}</div><h3>ごうかく！</h3><div>${t.n}もん ちゅう ${t.ok}もん せいかい</div>

 else{sNg();

function showPop(html){const o=$('#ov');o.innerHTML=`<div class="pop">${html}</div>`;o.classList.remove('hide')}
function closePop(){$('#ov').classList.add('hide');$('#ov').innerHTML=''}
const LINES=['さんすう しよう！','きょうも がんばろうね♪','すてきな おへやだね','ポイント ためて おかいもの！','なでなで うれしい〜'];
const ACT={
 go:a=>{sTap();go(a)},
 start:a=>{sTap();startQuiz(a)},
 key:a=>{const q=view==='test'?test:quiz;if(!q||q.lock||(view==='test'&&q.phase!=='run'))return;if(q.input.length<3){q.input=(q.input==='0'?'':q.input)+a;sTap();render()}},
 del:()=>{const q=view==='test'?test:quiz;if(!q||q.lock)return;q.input=q.input.slice(0,-1);sTap();render()},
 answer:()=>view==='test'?testAnswer():answer(),
 tready:a=>{sTap();testReady(a)},
 tlock:()=>{sNg();showPop(`<h3>🔒</h3><div>まえの テストに ごうかく すると ちょうせん できるよ！</div><div class="btns"><button class="big" data-act="close">OK</button></div>`)},
 tstart:a=>startTest(a),
 tinfo:a=>{sTap();testInfo(a)},
 twear:a=>{closePop();const it=ITEM[a];if(it.cat!=='furn')S.equip[it.cat]=a;save();dressTab=['outfit','hat','acc'].includes(it.cat)?'moko':'room';go(it.cat==='furn'?'home':'dress')},
 tscale:a=>{S.settings.testScale=Number(a);save();sTap();render()},
 shopcat:a=>{shopCat=a;sTap();render()},
 dresstab:a=>{dressTab=a;sTap();render()},
 buy:a=>{sTap();buy(a)},
 dobuy:a=>doBuy(a),
 wear:a=>wear(a),
 close:a=>{closePop();if(a)go(a)},
 pet:()=>{if(view!=='home')return;bubble=LINES[r(0,LINES.length-1)];homeMood='happy';sOk();render();clearTimeout(ACT._t);ACT._t=setTimeout(()=>{homeMood='normal';bubble='';if(view==='home')render()},2200)},
 gate,gateok:gateOk,
 tg:a=>{S.settings.types[a].on=!S.settings.types[a].on;save();sTap();render()},
 snd:()=>{S.settings.sound=!S.settings.sound;save();render()},
 st:a=>stepSet(a),
 adj:a=>{S.points=Math.max(0,S.points+Number(a));save();render()},
 bkmake:()=>{const o=$('#bkout');if(o){o.value=bkEnc(S);$('#bkmsg').textContent='コードを つくりました'}},
 bkcopy:()=>{const o=$('#bkout');if(!o||!o.value)return;const done=()=>{$('#bkmsg').textContent='コピーしました'};try{navigator.clipboard.writeText(o.value).then(done,()=>{o.select();try{document.execCommand('copy');done()}catch(e){$('#bkmsg').textContent='てで せんたくして コピーしてください'}})}catch(e){o.select()}},
 bkload:()=>{const i=$('#bkin'),v=i?i.value:'';let d=null;try{d=bkDec(v)}catch(e){}
  if(!d||typeof d.points!=='number'){bkArm=false;$('#bkmsg').textContent='コードが ただしく ありません';return}
  if(!bkArm){bkArm=true;const keep=v;render();$('#bkin').value=keep;$('#bkmsg').textContent=`⭐${d.points} の データです。もう いちど おすと いまの データを うわがき します`;return}
  bkArm=false;S=merge(d);save();render();$('#bkmsg').textContent='よみこみました！'},
 reset:()=>{if(!resetArm){resetArm=true;render();return}const keep=S.settings;S=defState();S.settings=keep;S.lastDay=today();resetArm=false;save();go('home')},
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const f=ACT[b.dataset.act];if(f)f(b.dataset.arg,b)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&$('#gatein'))gateOk()});

if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
Promise.race([initDb(),new Promise(res=>setTimeout(res,6000))]).finally(dailyCheck);
</script>
</body>
</html>
