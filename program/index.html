<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>プログラミング ― モコの おべんきょうハウス</title>
<link rel="manifest" href="../manifest.json">
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="icon" href="../common/piko-192.png">
<meta name="theme-color" content="#cdeffd">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="おべんきょうハウス">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#eaf7fd;touch-action:manipulation}
body{font-family:"M PLUS Rounded 1c",system-ui,sans-serif;color:#3f5566;-webkit-user-select:none;user-select:none}
#app{max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;background:#f5fbff}
header{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;background:#cdeffd;box-shadow:0 2px 0 #9fd9f2}
header .ttl{flex:1;font-weight:800;font-size:17px;color:#2b7fa8;text-align:center}
.hbtn{border:0;background:#fff;border-radius:999px;min-width:44px;height:40px;padding:0 12px;font:inherit;font-weight:800;font-size:15px;color:#2b7fa8;box-shadow:0 2px 0 #9fd9f2}
.hbtn.pts{display:flex;align-items:center;color:#e0719a;white-space:nowrap}
main{flex:1;padding:12px 12px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.card{background:#fff;border-radius:20px;box-shadow:0 3px 0 #d3e9f3;padding:12px}
.muted{color:#7d95a5;font-size:13px;text-align:center;margin:6px 0}

/* タイトル */
.hero{text-align:center;padding:18px 12px}
.hero h1{font-size:26px;margin:8px 0 4px;color:#2b7fa8}
.hero svg{width:120px;height:120px}
.stages{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sbtn{border:0;border-radius:16px;aspect-ratio:1;font:inherit;font-weight:800;font-size:22px;background:#fff;color:#2b7fa8;box-shadow:0 4px 0 #bfe3f3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.sbtn small{font-size:11px;letter-spacing:-1px;color:#f2b400}
.sbtn.lock{background:#e8eef2;color:#b5c2cb;box-shadow:0 4px 0 #d3dde3}
.sbtn.loop{background:#fff6e0;box-shadow:0 4px 0 #f1d79a}
.sbtn:active:not(.lock){transform:translateY(3px);box-shadow:none}
.sec{font-weight:800;color:#2b7fa8;margin:2px 0 8px;font-size:15px}

/* ばめん */
.hint{background:#fff;border-radius:14px;padding:8px 12px;font-weight:800;font-size:14px;color:#2b7fa8;box-shadow:0 2px 0 #d3e9f3;text-align:center}
.boardwrap{position:relative;width:100%;margin:0 auto}
.board{display:grid;gap:3px;background:#bfe3f3;padding:3px;border-radius:14px;position:relative}
.cell{background:#f4fbff;border-radius:8px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:min(7vw,30px)}
.cell.wall{background:#8fb3c7;box-shadow:inset 0 -4px 0 #6f97ad}
.cell.goal{background:#e4f8e0}
.robot{position:absolute;transition:left .32s ease,top .32s ease;pointer-events:none;display:flex;align-items:center;justify-content:center;z-index:2}
.robot svg{width:86%;height:86%;transition:transform .2s}
.robot.bonk svg{animation:bonk .4s}
.robot.yay svg{animation:yay .6s 2}
@keyframes bonk{0%,100%{transform:translateX(0)}25%{transform:translateX(-12%) rotate(-8deg)}75%{transform:translateX(12%) rotate(8deg)}}
@keyframes yay{0%,100%{transform:translateY(0)}50%{transform:translateY(-22%)}}
.star.got{animation:pop .35s forwards}
@keyframes pop{to{transform:scale(1.8);opacity:0}}

.prog{min-height:76px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:10px;border-radius:16px;background:#f4fbff;border:3px dashed #bfe3f3}
.prog.target{border-color:#5bbbe6;background:#eaf7fd}
.prog .empty{color:#9fb6c4;font-size:13px;font-weight:800}
.blk{border:0;border-radius:12px;width:44px;height:44px;font:inherit;font-weight:800;font-size:24px;color:#fff;background:#5bbbe6;box-shadow:0 3px 0 #3c98c2;display:flex;align-items:center;justify-content:center;padding:0}
.blk.run{outline:4px solid #ffcf3f;outline-offset:1px}
.loopbox{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:5px;padding:6px;border-radius:14px;background:#fff1cc;border:3px solid #f6c453;min-height:58px}
.loopbox.target{border-color:#f08c00;box-shadow:0 0 0 3px #ffe08a}
.loopbox.run{outline:4px solid #ffcf3f}
.loophd{border:0;border-radius:10px;background:#f6b41f;color:#fff;font:inherit;font-weight:800;font-size:15px;padding:6px 8px;box-shadow:0 3px 0 #d18f00;white-space:nowrap}
.loopx{position:absolute;top:-10px;right:-10px;width:28px;height:28px;border:0;border-radius:50%;background:#e5484d;color:#fff;font:inherit;font-weight:800;font-size:14px;box-shadow:0 2px 0 #b8343a;padding:0}
.loopbox .slot{color:#c59a2c;font-size:12px;font-weight:800;padding:0 4px}
.counter{font-weight:800;font-size:13px;color:#7d95a5;display:flex;justify-content:space-between;margin:0 4px 6px}
.counter b.over{color:#e5484d}

.pal{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pbtn{border:0;border-radius:16px;height:58px;font:inherit;font-weight:800;font-size:30px;color:#fff;background:#5bbbe6;box-shadow:0 4px 0 #3c98c2}
.pbtn.lp{background:#f6b41f;box-shadow:0 4px 0 #d18f00;font-size:15px;line-height:1.1}
.pbtn.sub{background:#b8c7d1;box-shadow:0 4px 0 #94a6b2;font-size:17px}
.pbtn:active,.big:active{transform:translateY(3px);box-shadow:none}
.pbtn:disabled{opacity:.4}
.row{display:grid;grid-template-columns:1fr 2fr;gap:8px}
.big{border:0;border-radius:18px;padding:14px;font:inherit;font-weight:800;font-size:20px;color:#fff;background:#3ccf8e;box-shadow:0 4px 0 #22a56b}
.big.gray{background:#b8c7d1;box-shadow:0 4px 0 #94a6b2}
.big.blue{background:#5bbbe6;box-shadow:0 4px 0 #3c98c2}
.big:disabled{opacity:.5}

/* ポップアップ */
.pop{position:fixed;inset:0;background:rgba(40,70,90,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.pop .card{width:100%;max-width:360px;text-align:center;padding:20px}
.pop h3{margin:6px 0;font-size:22px;color:#2b7fa8}
.pop .stars{font-size:40px;letter-spacing:4px;margin:6px 0}
.pop .stars .off{filter:grayscale(1);opacity:.3}
.pop .btns{display:grid;gap:10px;margin-top:14px}

/* iPad などの よこむき：ばめんを ひだり、プログラムと やじるしを みぎに（スクロール しなくても みえる） */
.colL,.colR{display:contents}
@media (orientation:landscape) and (min-width:700px){
 #app:has(main.play){max-width:1180px}
 main.play{display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,440px);gap:14px;align-items:start}
 main.play .colL,main.play .colR{display:flex;flex-direction:column;gap:12px;min-width:0}
 main.play .colR{position:sticky;top:8px}
 main.play .boardwrap{max-width:min(100%,calc((100dvh - 150px) * var(--ar)))!important}
 main.play .pbtn{height:66px}
 main.play .pbtn:not(.sub):not(.lp){font-size:36px}
 main.play .pbtn.lp{font-size:16px}
 main.play .blk{width:48px;height:48px;font-size:27px}
}
/* あたらしい しゅるい：むしとり・いろぬり・かぎと とびら */
.sbtn.bug{background:#ffeef0;box-shadow:0 4px 0 #f3b8c0}
.sbtn.paint{background:#f1ecff;box-shadow:0 4px 0 #c9b8f3}
.sbtn.key{background:#e9f8ea;box-shadow:0 4px 0 #a9dcaf}
.cell svg.tile{width:78%;height:78%}
.cell.water{background:#9fd6f3;box-shadow:inset 0 -4px 0 #74bde3}
.cell.tgt{background:#fff;box-shadow:inset 0 0 0 3px var(--pc,#ff7aa8);background-image:radial-gradient(circle,var(--pcl,#ffd6e5) 22%,transparent 24%)}
.cell.painted{background:var(--pc,#ff7aa8)!important;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12);background-image:none}
.cell.bad{background:#cfd8de!important;background-image:repeating-linear-gradient(45deg,transparent 0 6px,rgba(229,72,77,.35) 6px 9px)!important}
.cell.ppop{animation:paintpop .35s}
@keyframes paintpop{0%{transform:scale(.6)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
.blk.paint{background:#a27cf0;box-shadow:0 3px 0 #7d57cc}
.blk svg,.pbtn svg{width:70%;height:70%}
.pbtn.paint{background:#a27cf0;box-shadow:0 4px 0 #7d57cc}
.blk.sel{outline:4px solid #e5484d;outline-offset:2px;transform:scale(1.08)}
.blk.fixed{background:#ff9f43;box-shadow:0 3px 0 #d97a1c}
.loophd.fixed{background:#ff7a1a}
.bugtip{background:#fff6f6;border-radius:14px;padding:8px 10px;font-weight:800;font-size:13px;color:#c0464f;text-align:center}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center;font-size:12px;font-weight:800;color:#5d7f93}
.legend span{display:flex;align-items:center;gap:3px}.legend svg{width:22px;height:22px}
.buildcard{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;background:linear-gradient(120deg,#eaf7ff,#f1ffe8)}
.buildcard svg{width:64px;height:64px;flex:none}
.buildcard b{display:block;font-size:17px;color:#2b7fa8}
.buildcard span{font-size:12px;color:#5d7f93}
.buildcard .go{font-size:22px;color:#5bbbe6;margin-left:auto}
</style>
</head>
<body>
<div id="app"></div>
<script src="../common/learning-history.js"></script>
<script>
// ===== ステージ =====
// # かべ / S スタート / G ゴール / * ほし（ぜんぶ あつめてから ゴール）
// loop:true のステージから「くりかえし」ブロックが つかえる
// par … ⭐3 に なる ブロックの かず（loop なしは じどうで けいさん）
// max … おける ブロックの かず（loop なしは par+4）
const LEVELS=[
 {map:['.....','.....','S...G','.....','.....'],hint:'→ を ならべて 🏁 まで いこう！'},
 {map:['.....','...G.','.....','.....','S....'],hint:'↑ と → を くみあわせよう'},
 {map:['.....','S.#.G','.....'],hint:'かべ には ぶつからないように'},
 {map:['..*..','.....','S...G'],hint:'⭐ を ひろってから 🏁 へ'},
 {map:['S.#..','..#.*','..#..','.....','*...G'],hint:'⭐ を 2こ あつめよう'},
 {map:['S.#...','..#.#.','..#.#.','....#G'],hint:'めいろを ぬけよう'},
 {map:['S.......G'],loop:true,par:2,max:3,hint:'🔁 くりかえし の なかに → を いれてみよう'},
 {map:['.....G','....*.','...*..','..*...','.*....','S.....'],loop:true,par:3,max:4,hint:'↑→ を くりかえすと かいだんに なるよ'},
 {map:['S.*..','.....','..*.*','.....','....G'],loop:true,par:5,max:6,hint:'おなじ うごきを みつけよう'},
 {map:['.....','.###.','.###.','.###.','S###G'],loop:true,par:6,max:7,hint:'🔁 を 3つ つかおう'},
 {map:['S.....','#####.','......','.#####','.....G'],loop:true,par:10,max:11,hint:'ながい みち！ 🔁 で みじかく しよう'},
 {map:['S......','..*....','....*..','......G'],loop:true,par:4,max:5,hint:'→→↓ の くりかえし かな？'},
 /* ---- もっと ステージ（set:2。うしろに たすだけ：まえの ステージの ばんごう・★の きろくは かわらない） ---- */
 // par（⭐3 の ブロックの かず）は すべて じどうの さがしかたで たしかめた さいしょうの かず
 {set:2,map:['S.#.G','..#..','.....'],hint:'かべの したを まわって いこう'},
 {set:2,map:['..*..','.###.','S...G'],hint:'⭐ は かべの うえに あるよ'},
 {set:2,map:['S...#','.##.#','.#*.#','.#..G'],hint:'⭐ を とって 🏁 へ。みちを よく みてね'},
 {set:2,map:['..*#G.','.#.#..','S..*.#','##.#..'],hint:'⭐ 2こ。どっちから とる？'},
 {set:2,map:['*...*','.#.#.','..S..','.#.#.','....G'],hint:'まんなかから スタート！ ⭐ を 2こ'},
 {set:2,map:['S.#..*','.#..#.','...#..','##...G'],hint:'くねくね みちの おくに ⭐'},
 {set:2,map:['S#...','.#.#.','.#.#.','...#G'],hint:'したに いって、うえに いって…'},
 {set:2,map:['G.#*','..#.','.##.','S...'],hint:'ちょうせん！ ⭐ を とってから 🏁'},
 {set:2,map:['S.........G'],loop:true,par:3,max:4,hint:'10ぽ すすむには？ 🔁 は 9かい まで'},
 {set:2,map:['S......','.......','..*....','.......','....*..','.......','......G'],loop:true,par:3,max:4,hint:'ながい かいだんを おりよう'},
 {set:2,map:['#*#*#*#','S.....G'],loop:true,par:5,max:6,hint:'⭐ を とって もどる、を くりかえそう'},
 {set:2,map:['...G','..#.','..*.','#...','.*..','S...'],loop:true,par:5,max:6,hint:'1つ うごいてから くりかえし'},
 {set:2,map:['S.....','#####.','G.....'],loop:true,par:6,max:7,hint:'🔁 を 3つ つかおう'},
 {set:2,map:['...*...','..#.#..','.#...#.','S.....G'],loop:true,par:6,max:7,hint:'やまの てっぺんの ⭐ を とろう'},
 {set:2,map:['......G','.....#.','...*...','..#....','S......'],loop:true,par:6,max:7,hint:'うえに いく？ みぎに いく？'},
 {set:2,map:['S.....*','.#####.','.#####.','G.....*'],loop:true,par:6,max:7,hint:'ぐるっと まわって ⭐ を 2こ'},
 {set:2,map:['S#...#..G','.#.#.#.##','...#...##'],loop:true,par:9,max:10,hint:'いったり きたり。おなじ かたちが 2かい'},
 {set:2,map:['S.....*','#####..','*.....#','..#####','......G'],loop:true,par:11,max:12,hint:'さいごの ちょうせん！ ながい みちを 🔁 で'},

 /* ---- あたらしい しゅるい（set:3。うしろに たすだけ。need：この ステージを クリアすると ひらく） ----
    kind:'bug'   むしとり：bug の プログラムは まちがいが 1つ。ブロックを タップして なおす（⭐3 は 1かい で なおす）
    kind:'paint' いろぬり：p を 🖌 で ぬる（P は スタート かつ ぬる ところ）。おてほんと おなじに なったら クリア
    kind:'key'   かぎと とびら：k かぎ / D とびら（かぎで あく）/ o スイッチ / = はし（スイッチで かかる）/ ~ みず */
 {set:3,kind:'bug',need:5,map:['S...G'],bug:'RRDR',hint:'ピコが とちゅうで とまっちゃう！ まちがいを 1つ なおそう'},
 {set:3,kind:'bug',map:['S....','....G'],bug:'RRRUR',hint:'どこで おかしく なるかな？ ▶ で うごかして みよう'},
 {set:3,kind:'bug',map:['S.#..','..#..','.....','....G'],bug:'DURRRRD',hint:'かべに ぶつかる まえの ブロックが あやしい'},
 {set:3,kind:'bug',map:['S..','.*.','..G'],bug:'RDRR',hint:'⭐ を とってから 🏁 へ いきたいのに…'},
 {set:3,kind:'bug',map:['S....G'],bug:'3(R)',loop:true,hint:'🔁 の かいすうが ちがう かも？'},
 {set:3,kind:'bug',map:['....G','...*.','..*..','.*...','S....'],bug:'4(UL)',loop:true,hint:'かいだんを のぼりたい。🔁 の なかを よく みて'},
 {set:3,kind:'bug',map:['S...#','###.#','G....'],bug:'3(R)2(D)3(R)',loop:true,hint:'さいごの ほうが あやしい…'},
 {set:3,kind:'paint',need:5,color:'#ff7aa8',name:'せん',map:['Sppp.'],hint:'🖌 ぬる で、てんてんの マスを ぬろう'},
 {set:3,kind:'paint',color:'#4ab3f4',name:'しかく',map:['S...','.pp.','.pp.','....'],hint:'しかくを ぬろう。どの じゅんばんが はやい？'},
 {set:3,kind:'paint',color:'#3ccf8e',name:'プラス',map:['.....','..p..','.ppp.','..p..','S....'],hint:'＋ の かたちを ぬろう'},
 {set:3,kind:'paint',color:'#ff5a7a',name:'ハート',map:['S....','.p.p.','.ppp.','..p..'],hint:'ハートを かこう！'},
 {set:3,kind:'paint',color:'#ffb020',name:'ながい せん',map:['Spppppp'],loop:true,par:3,max:5,hint:'🔁 の なかに → と 🖌 を いれよう'},
 {set:3,kind:'paint',color:'#a27cf0',name:'ななめの せん',map:['S....','.p...','..p..','...p.','....p'],loop:true,par:4,max:6,hint:'↓→🖌 の くりかえし'},
 {set:3,kind:'paint',color:'#2fbfb0',name:'てんてん',map:['Sp.p.p.p.'],loop:true,par:4,max:6,hint:'ぬる、とばす、ぬる、とばす…'},
 {set:3,kind:'paint',color:'#e0524f',name:'まど',map:['Pppp','p..p','p..p','pppp'],loop:true,par:13,max:15,hint:'ちょうせん！ 🔁 を 4つ つかって わくを かこう'},
 {set:3,kind:'key',need:5,map:['S.k','##D','G..'],hint:'かぎを とると とびらが あくよ'},
 {set:3,kind:'key',map:['k.#..','..D..','S.#.G'],hint:'さきに かぎを とりに いこう'},
 {set:3,kind:'key',map:['S..k.','####D','G.Dk.'],hint:'とびらが 2つ。かぎも 2つ'},
 {set:3,kind:'key',map:['S.o..','~~=~~','....G'],hint:'スイッチを ふむと はしが かかるよ'},
 {set:3,kind:'key',map:['S.=.G','..~..','o.~..'],hint:'スイッチは どこかな？'},
 {set:3,kind:'key',map:['S.k#G','##D#=','o....'],hint:'ちょうせん！ かぎ と スイッチ の じゅんばんは？'},
];
const DIR={U:[0,-1,'↑'],D:[0,1,'↓'],L:[-1,0,'←'],R:[1,0,'→']};
const KN={bug:'むしとり',paint:'いろぬり',key:'かぎと とびら'};
// 'RR3(RD)P' → プログラム
function parseProg(t){const out=[];let i=0;while(i<t.length){const c=t[i];
 if(/\d/.test(c)){const j=t.indexOf(')',i);out.push({t:'loop',n:+c,body:t.slice(i+2,j).split('').map(x=>({t:x}))});i=j+1}else{out.push({t:c});i++}}return out}
const clone=p=>JSON.parse(JSON.stringify(p));
// ブロックの え（🖌 ぬる は SVG）
const BRUSH='<svg viewBox="0 0 24 24"><path d="M14 3l7 7-7 7-4-4z" fill="#fff"/><path d="M10 13l-5 5c-1 1-1 3 1 3 3 0 4-1 5-3l2-2z" fill="#ffd34f" stroke="#fff" stroke-width="1.2"/></svg>';
const lab=t=>t==='P'?BRUSH:DIR[t][2];
const labT=t=>t==='P'?'ぬる':DIR[t][2];
// マスの え
const TILE={
 key:'<svg class="tile" viewBox="0 0 40 40"><circle cx="13" cy="20" r="8" fill="none" stroke="#f2b400" stroke-width="5"/><path d="M20 20h16M30 20v7M35 20v5" stroke="#f2b400" stroke-width="5" stroke-linecap="round"/></svg>',
 door:'<svg class="tile" viewBox="0 0 40 40"><rect x="7" y="3" width="26" height="35" rx="5" fill="#b07a46" stroke="#7d5230" stroke-width="3"/><path d="M13 9h14M13 17h14M13 25h14" stroke="#8d5d33" stroke-width="2"/><circle cx="20" cy="21" r="4" fill="#ffd34f"/><path d="M19 23h2l1 6h-4z" fill="#ffd34f"/></svg>',
 open:'<svg class="tile" viewBox="0 0 40 40"><rect x="7" y="3" width="26" height="35" rx="5" fill="none" stroke="#b07a46" stroke-width="3" stroke-dasharray="4 3"/><path d="M7 3l9 4v32l-9-1z" fill="#b07a46" stroke="#7d5230" stroke-width="2"/></svg>',

function parse(lv){
 const g=lv.map.map(r=>r.split(''));const H=g.length,W=g[0].length;let s,goal,stars=[],keys=[],doors=[],tg=[];
 g.forEach((r,y)=>r.forEach((c,x)=>{if(c==='S'||c==='P')s=[x,y];if(c==='G')goal=[x,y];if(c==='*')stars.push([x,y]);
  if(c==='k')keys.push([x,y]);if(c==='D')doors.push([x,y]);if(c==='p'||c==='P')tg.push(x+'_'+y)}));
 return {g,W,H,s,goal,stars,keys,doors,tg,tgS:new Set(tg)};
}
// 1ぽ うごく（すすめない ときは msg）。st を かきかえる
function move1(P,st,d){
 const [dx,dy]=DIR[d],nx=st.pos[0]+dx,ny=st.pos[1]+dy,out=nx<0||ny<0||nx>=P.W||ny>=P.H,c=out?'#':P.g[ny][nx],sk=nx+'_'+ny,e={dx,x:nx,y:ny};
 if(out)return {msg:'そとに でちゃう！',...e};
 if(c==='#')return {msg:'かべに ぶつかっちゃった！',...e};
 if(c==='~'||(c==='='&&!st.sw))return {msg:'みずが あって わたれない！',...e};
 if(c==='D'&&!st.open.has(sk)){if(st.keys<1)return {msg:'かぎが ないと とびらが あかない！',...e};st.keys--;st.open.add(sk);e.open=sk}
 st.pos=[nx,ny];
 if(c==='*'&&!st.got.has(sk)){st.got.add(sk);e.star=sk}
 if(c==='k'&&!st.keyGot.has(sk)){st.keyGot.add(sk);st.keys++;e.key=sk}
 if(c==='o'&&!st.sw){st.sw=true;e.sw=1}
 return e;
}
const newSt=P=>({pos:[...P.s],keys:0,got:new Set(),keyGot:new Set(),open:new Set(),sw:false,paint:new Set()});
const isPaint=P=>P.tg.length>0;
// プログラムを さいごまで ためす（うごきの れつと、かち・まけ）
function simulate(P,pr){
 const st=newSt(P),ev=[];
 for(const s of steps(pr)){
  if(s.d==='P'){const k=st.pos.join('_');st.paint.add(k);ev.push({k:'paint',s,key:k,bad:!P.tgS.has(k)});continue}
  const e=move1(P,st,s.d);e.s=s;
  if(e.msg){e.k='bonk';ev.push(e);return {ev,win:false,msg:e.msg,st}}
  e.k='move';ev.push(e);
  if(!isPaint(P)&&e.x===P.goal[0]&&e.y===P.goal[1]&&st.got.size===P.stars.length)return {ev,win:true,st};
 }
 if(isPaint(P)){const extra=[...st.paint].some(k=>!P.tgS.has(k)),miss=P.tg.some(k=>!st.paint.has(k));
  if(!extra&&!miss)return {ev,win:true,st};
  return {ev,win:false,st,msg:extra?'おてほんに ない ところを ぬっちゃった':'まだ ぬって いない ところが あるよ',left:P.tg.filter(k=>!st.paint.has(k)).length}}
 return {ev,win:false,st,msg:'🏁 に とどかなかった…'};
}
// ⭐ を ぜんぶ ひろって ゴールする さいたん てすう（loop なし ステージ よう）
// （かぎ・とびら・スイッチ・ぬる も ふくめて しらべる）
function shortest(lv){
 const P=parse(lv),paint=isPaint(P),acts=paint?[...Object.keys(DIR),'P']:Object.keys(DIR);
 const sk=st=>[st.pos,[...st.got].sort(),[...st.keyGot].sort(),[...st.open].sort(),st.sw,[...st.paint].sort()].join('|');
 const done=st=>paint?P.tg.every(k=>st.paint.has(k)):st.pos[0]===P.goal[0]&&st.pos[1]===P.goal[1]&&st.got.size===P.stars.length;
 const cp=st=>({pos:[...st.pos],keys:st.keys,got:new Set(st.got),keyGot:new Set(st.keyGot),open:new Set(st.open),sw:st.sw,paint:new Set(st.paint)});
 const s0=newSt(P),q=[[s0,0]],seen=new Set([sk(s0)]);
 while(q.length){const [st,d]=q.shift();
  for(const a of acts){const n=cp(st);
   if(a==='P'){const k=n.pos.join('_');if(!P.tgS.has(k)||n.paint.has(k))continue;n.paint.add(k)}
   else if(move1(P,n,a).msg)continue;
   if(done(n))return d+1;
   const kk=sk(n);if(!seen.has(kk)){seen.add(kk);q.push([n,d+1])}}}
 return 99;
}

 if(full())return;sfx.tap();stopIfMoved();
 if(target!==null&&prog[target])prog[target].body.push({t:k});else prog.push({t:k});refresh()}
function addLoop(){if(running||full())return;sfx.tap();stopIfMoved();prog.push({t:'loop',n:2,body:[]});target=prog.length-1;refresh()}
function setTarget(e,i){e.stopPropagation();if(running||isBug())return;target=i<0?null:(target===i?null:i);refresh()}
function cycle(e,i){e.stopPropagation();if(running)return;sfx.tap();prog[i].n=prog[i].n>=9?2:prog[i].n+1;target=i;refresh()}
function del(e,i,j){e.stopPropagation();if(running)return;sfx.tap();
 if(isBug()){sel=sel&&sel[0]===i&&sel[1]===j?null:[i,j];refresh();return}
 stopIfMoved();
 if(j===undefined){prog.splice(i,1);if(target===i)target=null;else if(target>i)target--}else prog[i].body.splice(j,1);refresh()}
function undo(){if(running)return;stopIfMoved();
 if(target!==null&&prog[target]&&prog[target].body.length){prog[target].body.pop()}
 else if(prog.length){prog.pop();if(target!==null&&target>=prog.length)target=null}
 sfx.tap();refresh()}
function bugReset(){if(running)return;prog=clone(LEVELS[cur].bugProg);sel=null;stopIfMoved();sfx.tap();refresh()}
function clearAll(){if(running)return;prog=[];target=null;stopIfMoved();sfx.tap();refresh()}
function stopIfMoved(){if(pos[0]!==P.s[0]||pos[1]!==P.s[1]||got.size||vis.paint.size||vis.sw||vis.keyGot.size){resetRun()}}
function back(){resetRun();view='title';render();LH.endSession();lhIid=null}
function stop(){resetRun();render()}

function drawRobot(instant){
 const r=$('#robot');if(!r)return;
 if(instant)r.style.transition='none';
 const b=$('#board'),pad=3,gap=3,w=(b.clientWidth-pad*2-gap*(P.W-1))/P.W,h=(b.clientHeight-pad*2-gap*(P.H-1))/P.H;
 r.style.width=w+'px';r.style.height=h+'px';r.style.left=(pad+pos[0]*(w+gap))+'px';r.style.top=(pad+pos[1]*(h+gap))+'px';
 r.innerHTML=robotSVG(face);
 if(instant){r.offsetWidth;r.style.transition=''}
}
window.addEventListener('resize',()=>{if(view==='play')drawRobot(true)});

// プログラムを 1ぽずつの れつに する
function steps(pr=prog){const out=[];pr.forEach((b,i)=>{
 if(b.t!=='loop')out.push({d:b.t,id:'b'+i});
 else for(let k=0;k<b.n;k++)b.body.forEach((c,j)=>out.push({d:c.t,id:'b'+i+'_'+j,box:'b'+i}))});return out}

// マスの え（vis：いま みえて いる ようす）
function cellHTML(x,y){
 const c=P.g[y][x],k=x+'_'+y,v=vis;let cl='cell',in_='';
 if(c==='#')cl+=' wall';else if(c==='G'){cl+=' goal';in_='🏁'}
 else if(c==='*')in_=`<span class="star" id="st${k}" style="${got.has(k)?'opacity:0':''}">⭐</span>`;
 else if(c==='k')in_=v.keyGot.has(k)?'':`<span class="star" id="st${k}">${TILE.key}</span>`;
 else if(c==='D')in_=v.open.has(k)?TILE.open:TILE.door;
 else if(c==='o')in_=v.sw?TILE.swOn:TILE.sw;
 else if(c==='~'){cl+=' water';in_=TILE.wave}
 else if(c==='='){if(v.sw)in_=TILE.bridge;else{cl+=' water';in_=TILE.wave}}
 if(P.tgS.has(k))cl+=' tgt';
 if(v.paint.has(k))cl+=P.tgS.has(k)?' painted':' bad';
 return `<div class="${cl}" id="c${k}">${in_}</div>`;
}
function updCell(x,y,extra){const el=$('#c'+x+'_'+y);if(!el)return;el.outerHTML=cellHTML(x,y);if(extra){const n=$('#c'+x+'_'+y);if(n)n.classList.add(extra)}}

function run(){
 if(running||!prog.length)return;
 if(!isBug()&&count()>LEVELS[cur].max){flash('ブロックが おおすぎるよ');return}
 resetRun();target=null;sel=null;render();running=true;
 document.querySelectorAll('.pal button,.big').forEach(b=>{if(!b.classList.contains('gray'))b.disabled=true});
 const r=simulate(P,prog);let k=0;
 const tick=()=>{
  document.querySelectorAll('.run').forEach(e=>e.classList.remove('run'));
  if(k>=r.ev.length){if(r.win)end(true);else end(false,r.msg,r);return}
  const e=r.ev[k++],s=e.s,el=document.getElementById(s.id);if(el)el.classList.add('run');if(s.box)document.getElementById(s.box).classList.add('run');
  if(e.k==='paint'){vis.paint.add(e.key);const [x,y]=e.key.split('_').map(Number);updCell(x,y,'ppop');e.bad?sfx.bonk():beep(700+vis.paint.size*40,.12,'triangle');timer=setTimeout(tick,420);return}
  if(e.dx)face=e.dx;
  if(e.k==='bonk'){if(e.msg.includes('とびら')||e.msg.includes('みず')){const r2=$('#robot');r2.classList.add('bonk')}else{drawRobot();$('#robot').classList.add('bonk')}sfx.bonk();timer=setTimeout(tick,450);return}
  if(e.open){vis.open.add(e.open);updCell(e.x,e.y);beep(440,.1,'square',.08);setTimeout(()=>beep(660,.15,'triangle'),90)}
  pos=[e.x,e.y];drawRobot();sfx.step();
  if(e.star){got.add(e.star);const se=$('#st'+e.star);if(se)se.classList.add('got');setTimeout(sfx.star,150)}
  if(e.key){vis.keyGot.add(e.key);vis.keys++;const se=$('#st'+e.key);if(se)se.classList.add('got');setTimeout(sfx.star,150)}
  if(e.sw){vis.sw=true;P.g.forEach((row,y)=>row.forEach((c,x)=>{if(c==='o'||c==='=')updCell(x,y,c==='='?'ppop':'')}));setTimeout(()=>[392,523,659].forEach((f,i)=>setTimeout(()=>beep(f,.15,'triangle'),i*80)),120)}
  timer=setTimeout(tick,k>=r.ev.length&&r.win?380:420)};
 timer=setTimeout(tick,250);
}
function end(win,msg,r){
 running=false;document.querySelectorAll('.run').forEach(e=>e.classList.remove('run'));
 document.querySelectorAll('.pal button,.big').forEach(b=>b.disabled=false);
 const lv=LEVELS[cur];
 if(!win){lhRun(false);
  const left=P.stars.length-got.size,bug=isBug();
  showPop(`<div style="font-size:48px">${bug?'🐞':'🤔'}</div><h3>${msg}</h3><div class="muted">${isPaint(P)&&r&&r.left&&!msg.includes('ない ところ')?`あと ${r.left}マス ぬろう。`:''}${!isPaint(P)&&left&&msg.includes('とどか')?`⭐ が あと ${left}こ のこってるよ。`:''}${bug?(changes()?'まだ まちがいが あるかも。':'どの ブロックが まちがいかな？')+'ブロックを タップして なおそう':'ブロックを なおして もういちど！'}</div>
   <div class="btns"><button class="big blue" onclick="closePop();stop()">なおす</button></div>`);return}
 const n=count(),ch=isBug()?changes():0,stars=isBug()?(ch<=1?3:ch<=2?2:1):n<=lv.par?3:n<=lv.par+2?2:1;
 const prev=S.best[cur]||0,earn=Math.max(0,stars-prev)*starPts();if(stars>prev){S.best[cur]=stars;save()}houseAdd(earn);houseDaily();
 lhRun(true,stars,earn);
 const hw=HW&&cur===HW.stage;if(hw)houseWrite(d=>{d.hw=d.hw||{};d.hw[HW.mob]=Date.now()});
 $('#robot').classList.add('yay');sfx.win();
 const last=cur>=LEVELS.length-1;
 setTimeout(()=>showPop(`<div style="font-size:48px">🎉</div><h3>クリア！</h3>
  <div class="stars">${[1,2,3].map(i=>`<span class="${i<=stars?'':'off'}">⭐</span>`).join('')}</div>
  ${earn?`<div style="font-weight:800;font-size:20px;color:#e0719a;margin:4px 0">ポイント ⭐＋${earn}</div>`:''}
  ${isPaint(P)?`<div style="font-weight:800;color:${lv.color};font-size:18px">「${lv.name}」が かけたよ！</div>`:''}
  <div class="muted">${isBug()?`${ch}かい なおして できたよ${stars<3?'<br>1かい で なおせたら ⭐3！':'<br>むしとり めいじん！'}`:`ブロック ${n}こ で できたよ${stars<3?`<br>${lv.par}こ で できたら ⭐3！`:'<br>さいこうの プログラム！'}`}</div>
  <div class="btns">${last?'':`<button class="big" onclick="closePop();openLv(${cur+1})">つぎの ステージ ▶</button>`}
  ${stars<3?`<button class="big blue" onclick="closePop();stop()">もういちど ちょうせん</button>`:''}
  ${hw?`<a class="big" href="../machi/index.html" style="text-decoration:none;text-align:center;background:#7cc46a;box-shadow:0 4px 0 #5aa04a">📒 しゅくだい できた！ まちへ</a>`:''}
  <button class="big gray" onclick="closePop();back()">ステージ いちらん</button></div>`),700);
}

// ===== ポップアップ =====
function showPop(h){closePop();const d=document.createElement('div');d.className='pop';d.id='pop';d.innerHTML=`<div class="card">${h}</div>`;document.body.appendChild(d)}
function closePop(){const p=$('#pop');if(p)p.remove()}
let flT;function flash(t){const h=$('.hint');if(!h)return;clearTimeout(flT);const o=LEVELS[cur].hint;h.textContent=t;h.style.color='#e5484d';clearTimeout(flT);flT=setTimeout(()=>{const hh=$('.hint');if(hh){hh.textContent=o;hh.style.color=''}},1400)}

// まちの じゅうにんの しゅくだい（#hw=だれ|ステージばんごう）：その ステージを ひらく
const HW=(()=>{const m=/[#&]hw=([a-z_]+)\|(\d+)/.exec(location.hash);return m?{mob:m[1],stage:Math.min(LEVELS.length-1,+m[2])}:null})();
render();
if(HW&&unlocked(HW.stage))openLv(HW.stage);
if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('../sw.js').catch(()=>{});
</script>
