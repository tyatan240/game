<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>モコの おべんきょうハウス</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#ffd9e3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="おべんきょうハウス">
<meta name="sw" content="sw.js">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common/style.css">
<style>
nav{grid-template-columns:repeat(5,1fr)}
.gmach{width:210px;margin:0 auto;display:block}
.gmach .hdl{transform-box:fill-box;transform-origin:center}
.gmach.spin .hdl{animation:hspin .9s ease-in-out}
@keyframes hspin{to{transform:rotate(360deg)}}
.gmach.spin .dome{animation:shake .9s}
@keyframes shake{0%,100%{transform:translate(0)}20%{transform:translate(-3px,1px)}40%{transform:translate(3px,-1px)}60%{transform:translate(-2px,1px)}80%{transform:translate(2px,0)}}
.gmach .cap{opacity:0}
.gmach.spin .cap{animation:drop .7s .9s forwards}
@keyframes drop{0%{opacity:1;transform:translateY(-26px)}60%{opacity:1;transform:translateY(4px)}80%{transform:translateY(-3px)}100%{opacity:1;transform:translateY(0)}}
.ginfo{text-align:center;font-weight:800;margin:6px 0 10px}
.items .item.unk .n{color:#c9bcbc}
.goal.osu{background:linear-gradient(90deg,#fff7d6,#fff)}
.streak .stamps{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:6px}
.streak .stamp{display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:800;color:#a88f8f}
.streak .stamp svg{width:100%;max-width:40px}
.streak .stamp.today span{color:#e0719a}
.fixv{display:flex;flex-direction:column;overflow:hidden!important;padding-bottom:0!important}
.fixv>.tabs{flex:none}
.fixv .dpv{flex:none;margin-bottom:8px;padding:8px}
.fixv .preview.dpv svg{max-height:min(30vh,240px)}
.fixv .room.dpv svg{max-height:min(32vh,300px);width:auto;max-width:100%;margin:0 auto}
.fixv .dlist{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:2px 2px 12px;margin:0 -2px;border-top:3px dashed #ffd9e3}
.room .todoor{position:absolute;right:3%;top:30%;width:12%;display:flex;flex-direction:column;align-items:center;text-decoration:none;filter:drop-shadow(0 2px 0 rgba(0,0,0,.12))}
.room .todoor svg{width:100%;border-radius:0}
.room .todoor span{margin-top:-2px;background:#fff;border-radius:999px;padding:1px 8px;font-weight:800;font-size:12px;color:#7a9b4f;box-shadow:0 2px 0 #cfe8bd;white-space:nowrap}
.room .todoor:active{transform:translateY(2px)}
.item.dream{background:linear-gradient(160deg,#ffe3f1,#fff6d6,#e3f4ff,#efe3ff);box-shadow:0 3px 0 #e7b8e0,0 0 0 2px #fff inset}
.item.dream .p{color:#b45fd0}
.item.secret{background:linear-gradient(160deg,#f3ecff,#eaf7ff)}
.item.secret.lock .p{color:#8a76c9;font-size:11px}
.sil{background:#fff7f2;border-radius:12px}
.sil svg{filter:brightness(0) opacity(.22);background:none!important}
h2.dreamh .gt{background:linear-gradient(90deg,#ff6fae,#b07cff,#4fa8f0);-webkit-background-clip:text;background-clip:text;color:transparent}
h2.dreamh small,h2.sech small{font-size:11px;color:#9a8aa8;-webkit-text-fill-color:#9a8aa8}
h2.sech{font-size:15px;margin-top:16px;color:#7a5fc0}
.items .item.srbg{background:linear-gradient(160deg,#fff4fb,#f3ecff,#eaf7ff)}
.pop.sr{background:linear-gradient(160deg,#ffe3f1,#fff6d6,#e3f4ff,#efe3ff);box-shadow:0 0 0 4px #fff,0 0 30px 6px #ffd6ef}
.srlabel{font-weight:800;font-size:22px;background:linear-gradient(90deg,#ff6f9a,#ffb347,#4fc3f7,#a07cff);-webkit-background-clip:text;background-clip:text;color:transparent;animation:pop .4s}
.gprev{width:170px;margin:0 auto}
.gprev.sr{animation:glow 1.2s ease-in-out infinite alternate;border-radius:24px}
@keyframes glow{from{filter:drop-shadow(0 0 4px #ffd6ef)}to{filter:drop-shadow(0 0 14px #ffe27a)}}
.study{display:flex;align-items:center;gap:14px;background:#fff;border-radius:22px;padding:12px;margin-bottom:12px;text-decoration:none;color:inherit;box-shadow:0 4px 0 #f1d3d3}
.study:active{transform:translateY(3px);box-shadow:none}
.study .ic{width:72px;height:72px;border-radius:18px;flex:none;display:flex;align-items:center;justify-content:center;font-size:40px}
.study b{display:block;font-size:20px}
.study span{font-size:12px;color:#a88f8f}
a.big{text-align:center;text-decoration:none}
.goals .ghead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.goals .ghead b{color:#c8577f;font-size:16px}.goals .ghead span{font-weight:800;color:#e0719a}
.goal{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:2px dashed #f3e3e3;text-decoration:none;color:inherit}
.goal .gi{font-size:22px;width:30px;text-align:center}
.goal .gt{flex:1;font-weight:800;font-size:14px}.goal .gt small{display:block;font-size:11px;color:#a88f8f}
.goal .gbar{width:64px;height:10px;border-radius:999px;background:#f3e3e3;overflow:hidden}.goal .gbar i{display:block;height:100%;background:#ffb020}
.goal.ok .gbar i{background:#5cc28a}.goal.ok .gt small{color:#3d9a68}
.gall{margin-top:8px;text-align:center;font-weight:800;font-size:13px;color:#d9822b;background:#fff5df;border-radius:12px;padding:5px}
.gall.ok{color:#fff;background:#5cc28a}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="pts">⭐ <span id="pts">0</span></div>
    <div class="ttl">モコの おべんきょうハウス</div>
    <button id="gear" data-act="gate" aria-label="せってい">⚙️</button>
  </header>
  <main id="view"></main>
  <nav>
    <button data-act="go" data-arg="home"><span>🏠</span>おへや</button>
    <button data-act="go" data-arg="study"><span>📚</span>おべんきょう</button>
    <button data-act="go" data-arg="gacha"><span>🎰</span>ガチャ</button>
    <button data-act="go" data-arg="shop"><span>🛍️</span>おみせ</button>
    <button data-act="go" data-arg="dress"><span>🎀</span>きせかえ</button>
  </nav>
</div>
<div id="ov" class="hide"></div>
<script src="common/learning-history.js"></script>
<script src="common/core.js"></script>
<script src="common/hanamaru.js"></script>
<script src="common/pet.js"></script>
<script src="common/book.js"></script>
<script>
/* ---------- がめん ---------- */
const VIEWS=['home','study','gacha','shop','dress','settings'];
let view=VIEWS.includes(location.hash.slice(1))&&location.hash!=='#settings'?location.hash.slice(1):'home';
let bubble='',homeMood='normal',shopCat='outfit',dressTab='moko',resetArm=false;
if(location.hash==='#dress-room'){view='dress';dressTab='room'}
function go(v){view=v;history.replaceState(null,'',v==='home'||v==='settings'?location.pathname:'#'+v);render();$('main').scrollTop=0}
let lastView=null;
function render(){
 updPts();
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.arg===view));
 // タブの よこスクロールの いちを おぼえておく（えらぶたびに ひだりはしに もどらない ように）
 const keep=lastView===view?[...document.querySelectorAll('#view .tabs')].map(t=>t.scrollLeft):[];
 const dl=$('#view .dlist'),keepY=lastView===view&&dl&&dl.dataset.tab===dressTab?dl.scrollTop:0;lastView=view; // きせかえ：アイテムの スクロールいちを おぼえる
 $('#view').classList.toggle('fixv',view==='dress'); // きせかえ：うえの キャラ・おへやは うごかさない
 $('#view').innerHTML={home,study,gacha,shop,dress,settings}[view]();
 {const d=$('#view .dlist');if(d&&keepY)d.scrollTop=keepY}
 document.querySelectorAll('#view .tabs').forEach((t,i)=>{if(keep[i]!==undefined)t.scrollLeft=keep[i];
  const on=t.querySelector('button.on');if(!on)return;const l=on.offsetLeft-t.offsetLeft,r=l+on.offsetWidth;
  if(l<t.scrollLeft)t.scrollLeft=l-8;else if(r>t.scrollLeft+t.clientWidth)t.scrollLeft=r-t.clientWidth+8});
 if(view==='settings')storageInfo().then(h=>{const e=$('#stinfo');if(e)e.innerHTML=h});
}
// おへやの ドア → モコの まち（machi/）
const DOOR_SVG=`<svg viewBox="0 0 60 92"><rect x="4" y="4" width="52" height="84" rx="8" fill="#c98f55" stroke="#8f5e33" stroke-width="4"/><rect x="12" y="12" width="36" height="30" rx="5" fill="#bfe6ff" stroke="#fff" stroke-width="3"/><rect x="12" y="50" width="36" height="28" rx="4" fill="#b67b45"/><circle cx="44" cy="58" r="4" fill="#ffd34f"/><path d="M30 18 l3 6 6 1 -4.5 4 1 6 -5.5 -3 -5.5 3 1 -6 -4.5 -4 6 -1z" fill="#fff6a8"/></svg>`;
function home(){
 bookUpdate(); // もくひょうを 1つ たっせい していたら きょうの えほんの ページが ひらく
 return `<div class="card room">${bubble?`<div class="bubble">${bubble}</div>`:''}${roomSVG(S,homeMood,homeMood==='happy'?'hop':'sway')}<a class="todoor" href="machi/index.html" aria-label="まちへ でる">${DOOR_SVG}<span>まちへ</span></a>${petLayer()}</div>
 ${hmHomeCard()}${petHomeCard()}${bookHomeCard()}${goalsCard()}
 <button class="big" data-act="go" data-arg="study">おべんきょう する ▶</button>
 <p class="muted">キャラを タップしてみてね</p>`}
/* ---------- きょうの もくひょう ---------- */
function goalsCard(){
 const d=dailyOf(S),gs=goals(),n=gs.filter(g=>d[g.key]>=g.need).length;
 return `<div class="card goals"><div class="ghead"><b>🎯 きょうの もくひょう</b><span>${n} / ${gs.length}</span></div>
 ${gs.map(g=>{const v=Math.min(d[g.key],g.need),ok=v>=g.need;return `<a class="goal ${ok?'ok':''}" href="${g.href}"><span class="gi">${ok?'✅':g.icon}</span><span class="gt">${g.text}<small>${v} / ${g.need}　${ok?'たっせい！':'ごほうび ⭐'+S.settings.goalPts}</small></span><span class="gbar"><i style="width:${v/g.need*100}%"></i></span></a>`}).join('')}
 ${OSU?`<a class="goal osu ${d.got.rec?'ok':''}" href="${OSU.href}"><span class="gi">${d.got.rec?'✅':'🌟'}</span><span class="gt">おすすめ：「${OSU.name}」を ${OSU_NEED}もん れんしゅう<small>${OSU.count} / ${OSU_NEED}　${d.got.rec?'たっせい！':'ごほうび ⭐'+S.settings.goalPts}</small></span><span class="gbar"><i style="width:${OSU.count/OSU_NEED*100}%"></i></span></a>`:''}
 <div class="gall ${d.all?'ok':''}">${d.all?'🎉 ぜんぶ たっせい！ ⭐'+S.settings.goalAll+' もらったよ':'ぜんぶ たっせいで ボーナス ⭐'+S.settings.goalAll+'！'}</div></div>
 ${streakCard()}`}
/* ---------- きょうの おすすめ（学習レポートと れんどう）---------- */
// この30にちで 10もん いじょう といて、さいしょの せいかいが 70% みまんの たんげん を 1つ（1にち おなじ）。といた かずは 学習記録 から かぞえる
let OSU=null,STREAK=null;const OSU_NEED=5;
const OSU_T={sansu:['types',()=>TYPE,'sansu'],kokugo:['ktypes',()=>KTYPE,'kokugo'],eigo:['etypes',()=>ETYPE,'eigo']};
async function learnLoad(){
 if(!window.LH)return;
 const now=Date.now(),all=await LH.getAttempts({startDate:now-400*864e5}),d=dailyOf(S),month=all.filter(a=>a.ts>=now-30*864e5);
 if(!d.rec||!d.rec.s){ // まだ きまって いない ときは ひらく たびに さがす（きまったら その日は おなじ）
  const ok=t=>OSU_T[t.subject]&&S.settings[OSU_T[t.subject][0]][t.topic]&&S.settings[OSU_T[t.subject][0]][t.topic].on;
  const w=LH.byTopic(month.filter(a=>a.subject!=='prog')).filter(t=>t.questions>=10&&t.firstOk/t.questions<.7&&ok(t)).sort((a,b)=>a.firstOk/a.questions-b.firstOk/b.questions)[0];
  const nr=w?{s:w.subject,t:w.topic}:{s:'',t:''};if(!d.rec||d.rec.s!==nr.s){d.rec=nr;save()}}
 if(d.rec.s&&OSU_T[d.rec.s]){
  const T=OSU_T[d.rec.s],tbl=T[1](),today=all.filter(a=>a.day===LH.dayKey(now)&&a.subject===d.rec.s&&a.topic===d.rec.t);
  OSU={name:(tbl[d.rec.t]||{}).name||d.rec.t,href:`${T[2]}/index.html#start=${d.rec.t}`,count:Math.min(OSU_NEED,LH.instances(today).filter(q=>q.hasFirst).length)}}
 else OSU=null;
 // れんぞく べんきょう（学習記録の ひにち から）
 const days=new Set(all.map(a=>a.day)),t0=new Date();t0.setHours(0,0,0,0);
 let n=0;for(let i=days.has(LH.dayKey(+t0))?0:1;days.has(LH.dayKey(+t0-i*864e5));i++)n++;
 STREAK={n,week:[...Array(7)].map((_,i)=>days.has(LH.dayKey(+t0-(6-i)*864e5))),today:days.has(LH.dayKey(+t0))};
 if(view==='home')render();goalsCheck()}
/* ---------- ずっと つづけた ごほうび ---------- */
const STREAK_GOALS=[{n:3,pts:20},{n:7,item:'h_gambaricrown'},{n:14,pts:50},{n:30,item:'u_bigtrophy'}];
function streakCard(){
 if(!STREAK)return '';const nx=STREAK_GOALS.find(g=>!S.streakGot.includes(g.n));
 const lab=['日','月','火','水','木','金','土'],t0=new Date();
 return `<div class="card streak"><div class="ghead"><b>📅 がんばり カレンダー</b><span>れんぞく <b style="font-size:20px;color:#e0719a">${STREAK.n}</b> にち</span></div>
 <div class="stamps">${STREAK.week.map((on,i)=>{const d=new Date(+t0-(6-i)*864e5);return `<div class="stamp ${on?'on':''} ${i===6?'today':''}"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" fill="${on?'#ffb3cf':'#f3e6e6'}" stroke="${on?'#e0719a':'#e5d6d6'}" stroke-width="2.5"/>${on?`<path d="M20 9 l3 7 7 .6 -5.4 4.6 1.7 7 -6.3 -3.8 -6.3 3.8 1.7 -7 -5.4 -4.6 7 -.6z" fill="#fff"/>`:''}</svg><span>${lab[d.getDay()]}</span></div>`}).join('')}</div>
 <div class="muted" style="margin:4px 0 0;text-align:left">${nx?`あと <b>${Math.max(0,nx.n-STREAK.n)}</b>にち つづけると ${nx.item?`「${ITEM[nx.item].name}」が もらえるよ`:`⭐${nx.pts} もらえるよ`}（${nx.n}にち れんぞく）`:'ぜんぶの ごほうびを もらったよ！ すごい！'}${STREAK.today?'':'<br>きょうも 1もん といて スタンプを もらおう！'}</div></div>`}
function streakCheck(){
 if(!STREAK)return false;const g=STREAK_GOALS.find(x=>!S.streakGot.includes(x.n)&&STREAK.n>=x.n);if(!g)return false;
 S.streakGot.push(g.n);if(g.pts)S.points+=g.pts;if(g.item)grantItem(g.item)
 save();sBuy();setTimeout(sBuy,400);render();
 const it=g.item&&ITEM[g.item];
 showPop(`<div class="srlabel">📅 ${g.n}にち れんぞく！</div>${it?(it.cat==='furn'?`<div style="width:200px;margin:0 auto">${roomSVG(S,'happy','hop')}</div>`:charSVG({...S.equip,[it.cat]:it.id},'happy','hop')):charSVG(S.equip,'happy','hop')}
 <h3>${it?it.name:`⭐＋${g.pts}`}</h3><div>まいにち がんばって えらいね！${it?'<br>とくべつな ごほうびだよ':''}</div><div class="btns"><button class="big" data-act="close">やったー！</button></div>`);
 $('#ov .pop').classList.add('sr');return true}
// たっせい した もくひょうの ごほうびを わたす（おうちに もどった とき）
function goalsCheck(){
 if(!$('#ov').classList.contains('hide'))return;
 if(secretCheck())return; // ひみつの なかまが さき（とじると もういちど goalsCheck が よばれる）
 if(streakCheck())return;
 const d=dailyOf(S),gs=goals(),newly=gs.filter(g=>d[g.key]>=g.need&&!d.got[g.id]);
 if(OSU&&OSU.count>=OSU_NEED&&!d.got.rec)newly.push({id:'rec',text:`🌟 おすすめ：「${OSU.name}」を ${OSU_NEED}もん`});
 const allNow=gs.every(g=>d[g.key]>=g.need)&&!d.all;
 if(!newly.length&&!allNow)return;
 let add=0;newly.forEach(g=>{d.got[g.id]=true;add+=S.settings.goalPts});
 if(allNow){d.all=true;add+=S.settings.goalAll}
 S.points+=add;save();sBuy();render();
 showPop(`${charSVG(S.equip,'happy','hop')}<h3>${allNow?'🎉 きょうの もくひょう ぜんぶ たっせい！':'🎯 もくひょう たっせい！'}</h3>
 <div>${newly.map(g=>g.text).join('<br>')}</div><div class="stars" style="margin:8px 0">⭐＋${add}${allNow?` <small style="font-size:15px">（ボーナス＋${S.settings.goalAll}）</small>`:''}</div>
 <div class="btns"><button class="big" data-act="close">やったー！</button></div>`)}
// 🔒 テストの ごうかくで ひみつの なかまが くる（1かいに 1つずつ みせる）
function secretCheck(){
 const it=newSecrets()[0];if(!it)return false;
 grantItem(it.id);
 save();sBuy();setTimeout(sBuy,450);render();
 const pic=['char','outfit','hat','acc'].includes(it.cat)?charSVG({...S.equip,[it.cat]:it.id},'happy','hop'):thumb(it);
 showPop(`<div class="srlabel">🔒 ひみつの ${it.cat==='char'?'なかま':'アイテム'} 🔓</div><div class="gprev sr">${pic}</div><h3>${it.name}</h3>
 <div>テストに ${it.secret}かい ごうかく したから<br>${it.cat==='char'?'あいに きて くれたよ！':'とどいたよ！'}</div>
 <div class="btns"><button class="big gray" data-act="close">とじる</button><button class="big" data-act="gwear" data-arg="${it.id}">つけてみる</button></div>`);
 $('#ov .pop').classList.add('sr');return true}
function secretInfo(id){
 const it=ITEM[id],n=passCount();
 showPop(`<div style="width:120px;margin:0 auto" class="sil">${thumb(it)}</div><h3>？？？</h3><div>🏆 テストに <b>${it.secret}かい</b> ごうかく すると<br>${it.cat==='char'?'ひみつの なかまが あいに くるよ！':'ひみつの アイテムが もらえるよ！'}</div>
 <div class="stars" style="margin:8px 0;font-size:18px">いま ${n}かい ／ あと ${Math.max(0,it.secret-n)}かい</div>
 <div class="btns"><button class="big gray" data-act="close">とじる</button><button class="big" data-act="close" data-arg="study">おべんきょう ▶</button></div>`)}
function study(){
 const card=(href,ic,bg,name,col,desc)=>`<a class="study" href="${href}"><div class="ic" style="background:${bg}">${ic}</div><div><b style="color:${col}">${name}</b><span>${desc}</span></div></a>`;
 return `<h2>📚 おべんきょう</h2><p class="muted" style="text-align:left">どの へやでも ⭐ポイントが もらえるよ。ためた ポイントは おみせで つかえるよ！</p>
 ${card('sansu/index.html','✏️','#ffe3ea','さんすう','#c8577f','たしざん・ひきざん・くく・とけい、🏆テストで とくべつな アイテム')}
 ${card('kokugo/index.html','📖','#e3f4e8','こくご','#3f9a63','かん字・ことば・よみとり、🏆テストで とくべつな アイテム')}
 ${card('program/index.html','🤖','#dff3fc','プログラミング','#2b7fa8','ブロックを ならべて ロボットの ピコを うごかそう')}
 ${card('eigo/index.html','🔤','#fff0d6','えいご','#d9822b','ぼうけん（ABCぼうけん）と、れんしゅう・🏆テスト')}
 ${card('dungeon/index.html','⚔️','#ece6ff','イングリッシュ ダンジョン','#6a4ac8','えいごの なまえの てきや アイテム。ダンジョンの おくへ すすもう！')}`}
/* ---------- 🎰 ガチャ ---------- */
let gSpin=false;
const gToday=()=>{if(S.gacha.day!==today()){S.gacha.day=today();S.gacha.count=0}return S.gacha.count};
const gLeft=()=>S.settings.gachaDaily>0?Math.max(0,S.settings.gachaDaily-gToday()):Infinity;
function machineSVG(sr){
 const caps=[[70,62,'#ff9ec0'],[100,50,'#8fc8ff'],[130,64,'#ffd34f'],[82,92,'#b6ec9c'],[118,94,'#c3a8ff'],[100,78,'#ffb38a'],[62,100,'#8fc8ff'],[138,100,'#ff9ec0'],[100,108,'#ffd34f']];

 <div class="row"><div class="lbl"><b>ぜんぶ アンロック</b><small>${ADMIN()?'オン：ぜんぶ つかえる じょうたい':'オフ'}</small></div><button class="sw ${ADMIN()?'on':''}" data-act="admintg" aria-label="管理者モード"></button></div></div>
 <div class="card"><b>ほぞんの じょうたい</b><div class="muted" style="text-align:left" id="stinfo">しらべています…</div></div>
 <div class="card"><b>データの ひきつぎ（バックアップ）</b><div class="muted" style="text-align:left">べつの たんまつに うつす ときや、バックアップ したい ときに つかいます。「コードを つくる」で でた もじを コピーして、うつしさきの この がめんに はりつけて「よみこむ」を おしてください。<br>※ 学習レポートの履歴は このコードに 含まれません。「📊 学習レポート」の「学習データを保存」で べつに 保存できます。</div>
 <div class="tbtns"><button class="prac" data-act="bkmake">コードを つくる</button><button data-act="bkcopy">コピー</button></div>
 <textarea id="bkout" readonly style="width:100%;height:60px;margin-top:8px;font-size:11px;border:2px solid #ffd0dc;border-radius:10px"></textarea>
 <textarea id="bkin" placeholder="ここに コードを はりつけ" style="width:100%;height:60px;margin-top:8px;font-size:11px;border:2px solid #ffd0dc;border-radius:10px;-webkit-user-select:text;user-select:text"></textarea>
 <div class="tbtns"><button data-act="bkload">${bkArm?'もう いちど おすと うわがき します':'よみこむ'}</button></div><div class="msg" id="bkmsg"></div></div>
 <div class="card"><b>まるごと バックアップ（ファイル）</b><div class="muted" style="text-align:left">おうち・プログラミング・ABCぼうけん・ブロックタウン・まち・学習レポートの記録を、ぜんぶ 1つの ファイルに 保存します。iPad の かいかえ や こしょうに そなえて、ときどき 保存してください。</div>
 <div class="tbtns"><button class="prac" data-act="fullsave">ぜんぶ 保存</button><label style="flex:1;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;border-radius:12px;padding:8px 4px;font-weight:800;font-size:13px;background:#ff8fb1;color:#fff;box-shadow:0 3px 0 #e0688f">ファイルから 復元<input type="file" id="fullin" accept="application/json,.json" hidden></label></div><div class="msg" id="fullmsg"></div></div>
 <button class="big gray" data-act="reset">${resetArm?'もう いちど おすと ぜんぶ けします':'データを リセット'}</button>
 <div style="height:10px"></div><button class="big" data-act="go" data-arg="home">おわる</button>`}
let bkArm=false;
/* ---------- まるごと バックアップ（ぜんぶの へやの データ ＋ 学習記録）---------- */
// 保存キーは そのまま（形は かえない）。ふくげん は かくにん してから、それぞれの キーに かきもどす
const FULL_KEYS=['moko-math-v1','piko-prog-v1','abc-adventure-v1','robomoko-build-v1','moko-town-v1'];
const FULL_NAME={'moko-math-v1':'おうち（⭐・もちもの・きせかえ・テスト）','piko-prog-v1':'プログラミング','abc-adventure-v1':'ABCぼうけん','robomoko-build-v1':'ブロックタウン','moko-town-v1':'モコの まち'};
async function fullSave(){
 save();const data={};
 for(const k of FULL_KEYS){try{const v=k==='moko-math-v1'?S:JSON.parse(localStorage.getItem(k)||'null');if(v)data[k]=v}catch(e){}}
 let history=null;try{if(window.LH)history=await LH.exportAll()}catch(e){}
 const o={format:'moko-house-backup',version:1,savedAt:new Date().toISOString(),data,history};
 const d=new Date(),name=`moko-backup-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.json`;
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o)],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
 const m=$('#fullmsg');if(m)m.textContent=`ほぞん しました（${Object.keys(data).length}この へや${history?`・学習記録 ${history.attempts.length}件`:''}）`}
let fullPending=null;
function fullCheck(o){
 if(!o||o.format!=='moko-house-backup'||typeof o.version!=='number'||!o.data||typeof o.data!=='object')throw new Error('format');
 if(o.version>1)throw new Error('version');
 const keys=FULL_KEYS.filter(k=>o.data[k]&&typeof o.data[k]==='object');
 if(o.data['moko-math-v1']&&typeof o.data['moko-math-v1'].points!=='number')throw new Error('format');
 if(!keys.length)throw new Error('empty');
 return keys}
async function fullPick(f){
 const m=$('#fullmsg');let o;
 try{o=JSON.parse(await f.text());fullPending={o,keys:fullCheck(o)}}catch(e){fullPending=null;if(m)m.textContent=e.message==='version'?'この アプリより あたらしい ファイルです':'バックアップの ファイルでは ありません';return}
 const h=o.history&&Array.isArray(o.history.attempts)?o.history.attempts.length:0,md=o.data['moko-math-v1'];
 showPop(`<h3 style="font-size:20px">ファイルから 復元しますか？</h3><div style="text-align:left;line-height:1.7">${fullPending.keys.map(k=>'・'+FULL_NAME[k]).join('<br>')}${h?`<br>・学習記録 ${h}件（今の記録に たします）`:''}</div>
 ${md?`<div style="margin-top:6px">⭐ ${md.points}（いまは ⭐ ${S.points}）</div>`:''}<div class="muted" style="margin-top:6px">ファイルに ある へやの データは、いまの データと いれかわります。<br>（${new Date(o.savedAt||0).toLocaleString('ja-JP')} に ほぞん）</div>
 <div class="btns"><button class="big gray" data-act="close">やめる</button><button class="big" data-act="fullyes">復元する</button></div>`)}
async function fullRestore(){
 const P=fullPending;if(!P)return closePop();fullPending=null;const now=Date.now();
 for(const k of P.keys){
  const v=JSON.parse(JSON.stringify(P.o.data[k]));
  if(k==='moko-math-v1'){S=merge(v);save();continue} // おうちは merge を とおして 2かしょに ほぞん
  if('t' in v||k!=='piko-prog-v1')v.t=now;           // あたらしい ほうが つかわれる ように
  try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}
  const db={'robomoko-build-v1':'robomoko-build','moko-town-v1':'moko-town'}[k];
  if(db)try{const q=indexedDB.open(db,1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>{try{q.result.transaction('kv','readwrite').objectStore('kv').put(v,k)}catch(e){}}}catch(e){}
 }
 let hm='';try{if(P.o.history&&window.LH){const r=await LH.importData(P.o.history);hm=`・学習記録 ${r.added}件`}}catch(e){}
 closePop();render();const m=$('#fullmsg');if(m)m.textContent=`復元しました（${P.keys.length}この へや${hm}）`}
document.addEventListener('change',e=>{if(e.target&&e.target.id==='fullin'){const f=e.target.files[0];e.target.value='';if(f)fullPick(f)}});
const bkEnc=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o))));
const bkDec=t=>JSON.parse(decodeURIComponent(escape(atob(t.replace(/\s/g,'')))));
const LIM={perRound:[3,20],perfect:[0,50],daily:[0,50],t:[0,20],practiceMul:[1,5],practiceBonus:[0,50],progPts:[0,10],abcPts:[0,30],goalPts:[0,50],goalAll:[0,200],gachaCost:[10,500],gachaDaily:[0,10]};
function stepSet(arg){
 const [k,d]=arg.split('|'),dd=Number(d);
 if(k.startsWith('t:')||k.startsWith('k:')||k.startsWith('e:')){const o=S.settings[{t:'types',k:'ktypes',e:'etypes'}[k[0]]][k.slice(2)];o.pts=Math.max(LIM.t[0],Math.min(LIM.t[1],o.pts+dd))}
 else{const [lo,hi]=LIM[k];S.settings[k]=Math.max(lo,Math.min(hi,S.settings[k]+dd))}
 save();sTap();render()}


/* ---------- ログインボーナス ---------- */
function dailyCheck(){
 if(S.lastDay===today()) return;
 S.lastDay=today(); const b=S.settings.daily; if(b>0) S.points+=b; save();
 if(b>0) showPop(`${charSVG(S.equip,'happy')}<h3>おかえり！</h3><div>きょうの ログインボーナス</div><div class="stars">⭐＋${b}</div><div class="btns"><button class="big" data-act="close">やったー！</button></div>`);
}

/* ---------- ボタンの うごき ---------- */
const LINES=['おべんきょう しよう！','きょうも がんばろうね♪','すてきな おへやだね','ポイント ためて おかいもの！','なでなで うれしい〜'];
Object.assign(ACT,{
 go:a=>{sTap();go(a)},
 tinfo:a=>{sTap();testInfo(a)},
 sinfo:a=>{sTap();secretInfo(a)},
 shopcat:a=>{shopCat=a;sTap();render()},
 dresstab:a=>{dressTab=a;sTap();render()},
 buy:a=>{sTap();buy(a)},
 dobuy:a=>doBuy(a),
 wear:a=>wear(a),
 close:a=>{closePop();if(a)go(a);setTimeout(goalsCheck,200)},
 pet:()=>{if(view!=='home')return;bubble=LINES[r(0,LINES.length-1)];homeMood='happy';sOk();render();clearTimeout(ACT._t);ACT._t=setTimeout(()=>{homeMood='normal';bubble='';if(view==='home')render()},2200)},
 gate,gateok:gateOk,
 tg:a=>{S.settings.types[a].on=!S.settings.types[a].on;save();sTap();render()},
 ktg:a=>{S.settings.ktypes[a].on=!S.settings.ktypes[a].on;save();sTap();render()},
 etg:a=>{S.settings.etypes[a].on=!S.settings.etypes[a].on;save();sTap();render()},
 spin,
 gtg:()=>{S.settings.gachaOn=!S.settings.gachaOn;save();sTap();render()},
 gwear:a=>{closePop();const it=ITEM[a];if(it.cat==='furn'){if(!S.furn.includes(a))S.furn.push(a)}else equipItem(a);save();sTap();if(it.cat==='furn'||it.cat==='wall'||it.cat==='floor')go('home');else{dressTab='moko';go('dress')}},
 tscale:a=>{S.settings.testScale=Number(a);save();sTap();render()},
 snd:()=>{S.settings.sound=!S.settings.sound;save();render()},
 admintg:()=>{const on=!ADMIN();showPop(`<h3>🔑 管理者モードを ${on?'オン':'オフ'}に しますか？</h3><div style="text-align:left;font-size:14px">${on?'すべての アイテム・テスト・ステージ・まちの パーツと とちが つかえる ように なります。いまの もちものは 控えに のこして、オフに したとき もどします。':'もちものを 管理者モードに する まえに もどします（オンの あいだに もらった ごほうびは のこります）。着ている・かざっている ものが もっていない ものなら はずします。'}</div><div class="btns"><button class="big gray" data-act="close">やめる</button><button class="big" data-act="adminyes" data-arg="${on?1:0}">${on?'オンに する':'オフに する'}</button></div>`)},
 adminyes:a=>{adminSet(a==='1');closePop();sTap();render()},
 st:a=>stepSet(a),
 adj:a=>{S.points=Math.max(0,S.points+Number(a));save();render()},
 fullsave:()=>fullSave(),
 fullyes:()=>fullRestore(),
 bkmake:()=>{const o=$('#bkout');if(o){o.value=bkEnc(S);$('#bkmsg').textContent='コードを つくりました'}},
 bkcopy:()=>{const o=$('#bkout');if(!o||!o.value)return;const done=()=>{$('#bkmsg').textContent='コピーしました'};try{navigator.clipboard.writeText(o.value).then(done,()=>{o.select();try{document.execCommand('copy');done()}catch(e){$('#bkmsg').textContent='てで せんたくして コピーしてください'}})}catch(e){o.select()}},
 bkload:()=>{const i=$('#bkin'),v=i?i.value:'';let d=null;try{d=bkDec(v)}catch(e){}
  if(!d||typeof d.points!=='number'){bkArm=false;$('#bkmsg').textContent='コードが ただしく ありません';return}
  if(!bkArm){bkArm=true;const keep=v;render();$('#bkin').value=keep;$('#bkmsg').textContent=`⭐${d.points} の データです。もう いちど おすと いまの データを うわがき します`;return}
  bkArm=false;S=merge(d);save();render();$('#bkmsg').textContent='よみこみました！'},
 reset:()=>{if(!resetArm){resetArm=true;render();return}const keep=S.settings;S=defState();S.settings=keep;S.lastDay=today();resetArm=false;save();go('home')},
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&$('#gatein'))gateOk()});
render();
ready.then(()=>{dailyCheck();goalsCheck();learnLoad();setTimeout(()=>hmCheck(),600);petUpdate().then(()=>setTimeout(()=>petCheck(),900))}); // はなまるの おてがみ（ほかの ポップアップの あと）
window.addEventListener('pageshow',e=>{if(e.persisted){setTimeout(goalsCheck,300);learnLoad();petUpdate()}}); // べんきょうから もどったら ペットの ごはんを こうしん
</script>
</body>
