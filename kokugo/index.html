/* ========== もんだいを つくる ========== */
const isKana=c=>/[ぁ-んァ-ンー]/.test(c);
// にている ことばを まちがいの せんたくしに する
function pickSimilar(list,ans,key){
 const tail=w=>isKana(w[0].slice(-1))?w[0].slice(-1):'';
 const score=w=>(w[0].length===ans[0].length?2:0)+(tail(w)===tail(ans)?2:0)+Math.random()*2;
 const seen=new Set([ans[key]]),out=[];
 for(const w of [...list].sort((a,b)=>score(b)-score(a))){if(seen.has(w[key]))continue;seen.add(w[key]);out.push(w[key]);if(out.length===3)break}
 return out}
function makeQ(tid){
 if(tid==='k1yomi'||tid==='k2yomi'||tid==='k1kaki'||tid==='k2kaki'){
  const list=tid[1]==='1'?K1:K2,w=list[r(0,list.length-1)],yomi=tid.endsWith('yomi');
  return yomi?{tid,key:w[0],label:'この ことばの よみかたは？',main:w[0],ans:w[1],choices:shuffle([w[1],...pickSimilar(list,w,1)])}
   :{tid,key:w[0],label:'かん字で かくと どれ？',main:'「'+w[1]+'」',ans:w[0],choices:shuffle([w[0],...pickSimilar(list,w,0)]),size:'mid'}}
 if(tid==='kotoba'){const i=r(0,KOTOBA.length-1),[q,a,...ng]=KOTOBA[i];
  return {tid,key:'k'+i,label:'',main:q,ans:a,choices:shuffle([a,...ng]),size:'small'}}
 const si=r(0,STORIES.length-1),st=STORIES[si],qi=r(0,st.q.length-1),[q,a,...ng]=st.q[qi];
 return {tid,key:'s'+si+'-'+qi,story:st,label:'',main:q,ans:a,choices:shuffle([a,...ng]),size:'small'}}

}

function select(){

 ${en.length>1?`<button class="tbtn mix" data-act="start" data-arg="mix"><b>🎲 まぜまぜ</b>いろんな もんだいが でるよ</button>`:''}
 </div><p class="muted">${S.settings.perRound}もん ぜんぶ せいかいで ボーナス ⭐${S.settings.perfect}！</p>`}
function startQuiz(sel){
 const pool=sel==='mix'?enabled().map(t=>t.id):[sel];
 quiz={pool,sel,i:0,n:S.settings.perRound,ok:0,earned:0,res:[],cur:null,tries:0,ng:[],mood:'normal',msg:'',lock:false,used:new Set()};
 nextQ();view='quiz';render();$('main').scrollTop=0}
function nextQ(){
 let q,g=0;
 do{q=makeQ(quiz.pool[r(0,quiz.pool.length-1)])}while(quiz.used.has(q.key)&&g++<30);
 quiz.used.add(q.key);quiz.cur=q;quiz.tries=0;quiz.ng=[];quiz.mood='normal';quiz.msg='';$('main').scrollTop=0}
function quizV(){
 const q=quiz,c=q.cur,done=q.lock;
 const dots=Array.from({length:q.n},(_,i)=>`<i class="${q.res[i]===true?'ok':q.res[i]===false?'ng':i===q.i?'now':''}"></i>`).join('');
 const long=c.choices.some(x=>x.length>6);
 return `<div class="dots">${dots}</div>
 ${c.story?`<div class="story"><b>📖 ${c.story.t}</b>${c.story.s}</div>`:''}
 <div class="card qcard kq">${charSVG(S.equip,q.mood,q.mood==='happy'?'hop':'')}<div class="qt">${c.label?`<div class="qlabel">${c.label}</div>`:''}<div class="qmain ${c.size||''}">${c.main}</div></div></div>
 <div class="msg">${q.msg||'⭐'+S.settings.ktypes[c.tid].pts+' の もんだい'}</div>
 <div class="choices ${long?'one':''}">${c.choices.map((x,i)=>`<button class="ch ${c.choices.some(y=>y.length>4)?'long':''} ${q.ng.includes(i)?'ng':''} ${done&&x===c.ans?'ok':''}" data-act="pick" data-arg="${i}">${x}</button>`).join('')}</div>`}
function pick(i){
 const q=quiz;if(!q||q.lock||q.ng.includes(i))return;
 const c=q.cur,tp=S.settings.ktypes[c.tid].pts;
 if(c.choices[i]===c.ans){
  const pts=q.tries===0?tp:Math.ceil(tp/2);
  q.ok++;q.earned+=pts;q.res[q.i]=true;S.points+=pts;S.kstats.q++;S.kstats.ok++;save();
  q.mood='happy';q.msg=`せいかい！ ⭐＋${pts}`;sOk();q.lock=true;render();
  setTimeout(advance,1200);
 }else if(q.tries===0){
  q.tries=1;q.ng.push(i);q.mood='oops';q.msg='おしい！ もういちど えらんでね';sNg();render();
 }else{
  q.ng.push(i);q.res[q.i]=false;S.kstats.q++;save();q.mood='oops';q.msg=`こたえは「${c.ans}」だよ。つぎ がんばろう！`;sNg();q.lock=true;render();
  setTimeout(advance,2200);
 }}
function advance(){
 const q=quiz;if(!q||view!=='quiz')return;q.lock=false;q.i++;
 if(q.i>=q.n){
  q.bonus=(q.ok===q.n&&S.settings.perfect>0)?S.settings.perfect:0;
  if(q.bonus){S.points+=q.bonus;save()}
  view='result';if(q.bonus)sBuy();render();return}
 nextQ();render()}
function result(){
 const q=quiz,perfect=q.ok===q.n;
 return `<div class="card" style="text-align:center"><div style="width:150px;margin:0 auto">${charSVG(S.equip,'happy','hop')}</div>
 <h2 style="font-size:24px">${perfect?'ぜんもん せいかい！すごい！':q.ok>=q.n/2?'よく がんばったね！':'チャレンジ えらい！'}</h2>
 <div>${q.n}もん ちゅう <b style="font-size:24px;color:#e0719a">${q.ok}</b>もん せいかい</div>
 <div class="stars" style="margin:10px 0">⭐＋${q.earned}${q.bonus?` <small style="font-size:16px">（ボーナス＋${q.bonus}）</small>`:''}</div></div>
 <button class="big" data-act="start" data-arg="${q.sel}">もういちど</button><div style="height:10px"></div>
 <a class="big sub" href="../index.html#shop">おみせに いく 🛍️</a>`}

/* ========== テスト（さんすうと おなじ ルール）========== */
let test=null,tTimer=null;
function tests(){
 const en=enabled();
 if(!en.length) return `<div class="card"><p class="muted">もんだいが えらばれていません</p></div>`;
 return `<h2>🏆 テスト</h2><p class="muted" style="text-align:left">じかん ないに ごうかく すると、ここでしか もらえない とくべつな アイテムが もらえるよ！</p>`+
 en.map(t=>`<div class="card"><b>${t.name}</b>${TLV.map((L,lv)=>{const key=t.id+'-'+(lv+1),st=S.tests[key]||{},it=testItem(key),open=testUnlocked(key);
  return `<div class="trow ${st.pass?'pass':''}"><div class="tth">${thumb(it)}</div><div class="lbl"><b>${L.medal} ${L.name}　<span style="color:#e0719a">${it.name}</span></b><small>${L.n}もん ／ ⏱${testLimit(t.id,lv)}びょう ／ ${passRule(L)}で ごうかく</small><small>${st.pass?'✔ ごうかく ずみ！':open?(st.best!=null?'さいこう：'+st.best+'もん':'ちょうせん できるよ！'):'🔒 まえの テストに ごうかく すると ひらくよ'}</small>
   <div class="tbtns"><button class="prac" data-act="tready" data-arg="${key}|p">✏️ れんしゅう <span>⭐×${S.settings.practiceMul}</span></button><button class="${open?'':'off'}" data-act="${open?'tready':'tlock'}" data-arg="${key}">🏆 テスト</button></div></div></div>`}).join('')}</div>`).join('')}
const pracPts=tid=>S.settings.ktypes[tid].pts*S.settings.practiceMul;
function testReady(arg){
 const [key,p]=arg.split('|'),prac=p==='p',{tid,lv}=parseKey(key),L=TLV[lv],it=testItem(key);
 showPop(`<div class="medal">${prac?'✏️':L.medal}</div><h3>${KTYPE[tid].name}<br>${L.name}${prac?' の れんしゅう':''}</h3>
 <div style="text-align:left;line-height:1.8;margin:8px 0">・もんだい：${L.n}もん<br>・じかん：<b>${testLimit(tid,lv)}びょう</b><br>・まちがえても やりなおしは できないよ<br>${prac?`・せいかい 1もんで <b>⭐${pracPts(tid)}</b>（ふだんの ${S.settings.practiceMul}ばい！）<br>・${passRule(L)}で ボーナス ⭐${S.settings.practiceBonus}`:`・${passRule(L)}で ごうかく`}</div>
 ${prac?'':`<div style="width:90px;margin:0 auto">${thumb(it)}</div><div>ごほうび：<b>${it.name}</b></div>`}
 <div class="btns"><button class="big gray" data-act="close">やめる</button><button class="big ${prac?'sub':''}" data-act="tstart" data-arg="${arg}">スタート！</button></div>`)}
function stopTest(){clearInterval(tTimer);tTimer=null}
function startTest(arg){
 closePop();stopTest();
 const [key,p]=arg.split('|'),{tid,lv}=parseKey(key),L=TLV[lv];
 test={key,tid,lv,prac:p==='p',earned:0,n:L.n,need:L.need,limit:testLimit(tid,lv)*1000,i:0,ok:0,cur:null,used:new Set(),pick:-1,lock:false,phase:'count',count:3,msg:'',t0:0};
 view='test';tNext();render();$('main').scrollTop=0;beep(660,.1);
 tTimer=setInterval(()=>{
  if(!test){stopTest();return}
  if(test.phase==='count'){test.count--;if(test.count<=0){test.phase='run';test.t0=performance.now();stopTest();beep(990,.2);render();tTimer=setInterval(tTick,100)}else{beep(660,.1);render()}}
 },800)}
function tNext(){let q,g=0;do{q=makeQ(test.tid)}while(test.used.has(q.key)&&g++<30);test.used.add(q.key);test.cur=q;test.pick=-1;test.msg=''}
function tLeft(){return Math.max(0,test.limit-(performance.now()-test.t0))}
function tTick(){
 if(!test||test.phase!=='run')return;
 const left=tLeft(),pct=left/test.limit*100,bar=$('#tbar'),sec=$('#tsec');
 if(bar){bar.style.width=pct+'%';bar.classList.toggle('low',pct<25)}
 if(sec)sec.textContent=Math.ceil(left/1000);
 if(left<=0)finishTest(true)}
function testV(){
 const t=test;
 if(t.phase==='count') return `<div class="card" style="text-align:center"><div class="medal">${t.prac?'✏️':TLV[t.lv].medal}</div><b>${KTYPE[t.tid].name} ${TLV[t.lv].name}${t.prac?' の れんしゅう':''}</b><div class="count">${t.count}</div><div class="muted">よーい…</div></div>`;
 const c=t.cur,left=tLeft(),pct=left/t.limit*100,long=c.choices.some(x=>x.length>6),small=c.choices.some(y=>y.length>4);
 return `<div class="tbarw"><div class="tbar ${pct<25?'low':''}" id="tbar" style="width:${pct}%"></div></div>
 <div class="tinfo"><span>⏱ <b id="tsec">${Math.ceil(left/1000)}</b>びょう</span><span>${t.prac?'✏️ ':''}${t.i+1} / ${t.n}もんめ</span><span>⭕ ${t.ok}</span></div>
 ${c.story?`<div class="story"><b>📖 ${c.story.t}</b>${c.story.s}</div>`:''}
 <div class="card qcard" style="text-align:center">${c.label?`<div class="qlabel">${c.label}</div>`:''}<div class="qmain ${c.size||''}">${c.main}</div></div>
 <div class="msg">${t.msg||'&nbsp;'}</div>
 <div class="choices ${long?'one':''}">${c.choices.map((x,i)=>`<button class="ch ${small?'long':''} ${t.lock&&x===c.ans?'ok':''} ${t.lock&&i===t.pick&&x!==c.ans?'ng':''}" data-act="tpick" data-arg="${i}">${x}</button>`).join('')}</div>`}
function testPick(i){
 const t=test;if(!t||t.phase!=='run'||t.lock)return;
 const c=t.cur,right=c.choices[i]===c.ans;t.pick=i;
 S.kstats.q++;
 if(right){t.ok++;S.kstats.ok++;
  if(t.prac){const pts=pracPts(t.tid);t.earned+=pts;S.points+=pts;t.msg=`⭕ せいかい！ ⭐＋${pts}`}else t.msg='⭕ せいかい！';
  beep(1046,.08)}
 else{t.msg=`❌ こたえは「${c.ans}」`;sNg()}
 save();t.i++;
 if(t.i>=t.n||(!t.prac&&(t.i-t.ok)>(t.n-t.need))){t.lock=true;stopTest();t.i--;render();t.i++;setTimeout(()=>finishTest(false),right?500:1000);return}
 t.lock=true;t.i--;render();t.i++;
 setTimeout(()=>{if(!test||view!=='test'||test!==t)return;t.lock=false;tNext();render();$('main').scrollTop=0},right?350:1000)}
function finishTest(timeout){
 const t=test;if(!t||t.phase==='done')return;
 t.phase='done';stopTest();
 if(t.prac){
  const okLine=t.ok>=t.need,bonus=okLine?S.settings.practiceBonus:0;
  if(bonus){S.points+=bonus}save();view='tests';render();
  okLine?sBuy():sNg();
  showPop(`${charSVG(S.equip,okLine?'happy':'oops',okLine?'hop':'')}<h3>${timeout?'じかん ぎれ！':'れんしゅう おわり！'}</h3><div>${timeout?`${t.n}もん ちゅう ${t.i}もん まで こたえて ${t.ok}もん せいかい`:`${t.n}もん ちゅう ${t.ok}もん せいかい`}</div>
  <div class="stars" style="margin:8px 0">⭐＋${t.earned+bonus}${bonus?` <small style="font-size:15px">（ボーナス＋${bonus}）</small>`:''}</div>
  <div class="muted">${okLine?'テストなら ごうかく できる ちょうし！🏆':`テストの ごうかくまで あと ${t.need-t.ok}もん！`}</div>
  <div class="btns"><button class="big sub" data-act="tstart" data-arg="${t.key}|p">もういちど</button>${testUnlocked(t.key)?`<button class="big" data-act="tready" data-arg="${t.key}">テストへ 🏆</button>`:''}</div>
  <div class="btns"><button class="big gray" data-act="close">とじる</button></div>`);
  test=null;return}
 const L=TLV[t.lv],it=testItem(t.key),pass=t.ok>=t.need,st=S.tests[t.key]||{},first=pass&&!st.pass;
 dailyOf(S).kokugo++; // きょうの もくひょう
 S.tests[t.key]={pass:!!(st.pass||pass),best:Math.max(st.best||0,t.ok)};
 if(first&&!S.owned.includes(it.id)){S.owned.push(it.id);if(it.cat==='furn'&&!S.furn.includes(it.id))S.furn.push(it.id)}
 save();view='tests';render();
 if(pass){sBuy();
  showPop(`<div class="medal">${L.medal}</div><h3>ごうかく！</h3><div>${t.n}もん ちゅう ${t.ok}もん せいかい</div>
  ${first?`<div style="width:110px;margin:8px auto">${it.cat==='furn'||it.cat==='wall'||it.cat==='floor'?thumb(it):charSVG({...S.equip,[it.cat]:it.id},'happy','hop')}</div><div><b>${it.name}</b> を ゲット！</div>
  <div class="btns"><button class="big gray" data-act="close">あとで</button><button class="big" data-act="twear" data-arg="${it.id}">${it.cat==='furn'||it.cat==='wall'||it.cat==='floor'?'おへやを みる':'つけてみる'}</button></div>`
  :`<div class="btns"><button class="big" data-act="close">OK</button></div>`}`)}
 else{sNg();
  showPop(`${charSVG(S.equip,'oops')}<h3>${timeout?'じかん ぎれ！':'ざんねん！'}</h3><div>${timeout?`${t.n}もん ちゅう ${t.i}もん まで こたえて `:''}${t.ok}もん せいかい（ごうかくは ${t.need}もん）</div><div class="muted">れんしゅう して また ちょうせん しよう！</div>
  <div class="btns"><button class="big gray" data-act="close">とじる</button><button class="big" data-act="tstart" data-arg="${t.key}">もういちど</button></div>`)}
 test=null}

Object.assign(ACT,{
 tready:a=>{sTap();testReady(a)},
 tlock:()=>{sNg();showPop(`<h3>🔒</h3><div>まえの テストに ごうかく すると ちょうせん できるよ！</div><div class="btns"><button class="big" data-act="close">OK</button></div>`)},
 tstart:a=>startTest(a),
 tpick:a=>testPick(Number(a)),
 twear:a=>{closePop();const it=ITEM[a];if(it.cat!=='furn')equipItem(a);save();location.href=it.cat==='furn'?'../index.html':['outfit','hat','acc'].includes(it.cat)?'../index.html#dress':'../index.html#dress-room'},
 close:a=>{closePop();if(a)go(a)},
 go:a=>{sTap();go(a)},
 start:a=>{sTap();startQuiz(a)},
 pick:a=>pick(Number(a)),
});
render();
</script>
</body>
