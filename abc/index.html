<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ABCぼうけん</title>
<meta name="theme-color" content="#3f8f4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="../icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="intitle">
<canvas id="cv"></canvas>

<div id="hud">
  <div class="stars"><svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3 6.1 20.6l1.3-6.6L2.5 9.4l6.6-.8z" fill="#ffd34f" stroke="#e5a91c" stroke-width="1.5" stroke-linejoin="round"/></svg><b id="starN">0</b></div>
  <div id="slots"></div>
  <button id="menuBtn" aria-label="メニュー"><svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h14" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></button>
</div>

<div id="pad" aria-label="ほうこうパッド">
  <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="rgba(255,255,255,.35)" stroke="rgba(255,255,255,.8)" stroke-width="2"/>
  <g fill="#fff" stroke="#7a9a7a" stroke-width="1.5" stroke-linejoin="round">
    <path class="u" d="M50 10 L64 30 H36 Z"/><path class="d" d="M50 90 L64 70 H36 Z"/><path class="l" d="M10 50 L30 36 V64 Z"/><path class="r" d="M90 50 L70 36 V64 Z"/></g>
  <circle cx="50" cy="50" r="9" fill="rgba(255,255,255,.7)"/></svg>
</div>
<button id="act" aria-label="はなす・しらべる">はなす</button>

<div id="title">
  <div class="logo"><span>A</span><span>B</span><span>C</span><em>ぼうけん</em></div>
  <p class="sub">もじを おぼえて せかいを たすけよう！</p>
  <div class="tbtns">
    <button id="cont">つづきから</button>
    <button id="start">はじめから</button>
  </div>
  <p class="tip">PC：やじるしキー で あるく ／ スペース で はなす</p>
  <a class="back" href="../index.html">おべんきょうハウスへ もどる</a>
</div>

<div id="goal" class="hide"></div>
<div id="rotate">よこむきに すると あそびやすいよ</div>
<div id="layer"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
